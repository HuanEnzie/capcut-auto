/* ══════════════════════════════════════════════════════════════════
   TOKENS — bám đúng DESIGN.md (Duolingo style reference)
   Sửa giao diện thì sửa ở đây trước, đừng hardcode màu/kích thước bên dưới.
   ══════════════════════════════════════════════════════════════════ */
:root{
  /* Colors */
  --color-eager-green:#58cc02;
  --color-storybook-green:#d7ffb8;
  --color-spark-blue:#1cb0f6;
  --color-fresh-leaf:#a5ed6e;
  --color-night-ink:#000437;
  --color-paper-white:#ffffff;
  --color-charcoal:#4b4b4b;
  --color-pencil-gray:#777777;
  --color-faded-gray:#afafaf;
  /* mở rộng ngoài DESIGN.md: viền mảnh cho bề mặt lớn.
     Spec chỉ cho #afafaf, dùng 2px cho MỌI thẻ thì nặng mặt -> giữ #afafaf cho
     phần tử tương tác (nút/input/pill) đúng spec, bề mặt lớn dùng hairline. */
  --color-hairline:#e5e5e5;
  --color-danger:#e5533d;

  /* Typography */
  --font-feather:'Nunito','Segoe UI Variable Display','Segoe UI',system-ui,sans-serif;
  --font-body:'Nunito','Segoe UI Variable Text','Segoe UI',system-ui,sans-serif;
  --text-caption:13px;   --leading-caption:1.23;
  --text-nav-label:15px; --leading-nav-label:1.33; --tracking-nav-label:0.053em;
  --text-body:17px;      --leading-body:1.45;
  --text-subheading:19px;--leading-subheading:1.4;
  --text-heading-sm:32px;--leading-heading-sm:1.2;
  --font-weight-medium:500; --font-weight-bold:700;

  /* Spacing (base 4px, density comfortable) */
  --spacing-8:8px; --spacing-12:12px; --spacing-16:16px; --spacing-24:24px;
  --spacing-32:32px; --spacing-40:40px; --spacing-48:48px;

  /* Layout & shape */
  --page-max-width:1200px;
  --card-padding:20px;
  --element-gap:12px;
  --radius:12px;          /* spec: KHÔNG có góc nhọn, kể cả tag/pill */
  --border-w:2px;         /* spec: viền dày, cảm giác sticker dán lên giấy */
}

/* ══════════════════ BASE ══════════════════ */
*{box-sizing:border-box}
html,body{margin:0}
body{
  background:var(--color-paper-white);
  color:var(--color-charcoal);
  font-family:var(--font-body);
  font-size:var(--text-body);
  font-weight:var(--font-weight-medium);
  line-height:var(--leading-body);
}
:focus-visible{outline:3px solid var(--color-spark-blue);outline-offset:2px;border-radius:var(--radius)}
::selection{background:var(--color-storybook-green)}

/* ══════════════════ KHUNG: sidebar + cột nội dung ══════════════════
   Bốn tab nằm ngang cũ hết chỗ khi thêm khu vực mới, và không còn chỗ nào để
   đặt danh sách hội thoại của Agent. Sidebar giải quyết cả hai: thêm mục là
   thêm một dòng, và Agent có chỗ liệt kê các cuộc trò chuyện.  */
.app{display:flex;min-height:100vh}
.side{
  width:248px;flex:0 0 248px;display:flex;flex-direction:column;
  border-right:var(--border-w) solid var(--color-hairline);
  background:var(--color-paper-white);position:sticky;top:0;height:100vh;
}
.side .brand{display:flex;align-items:center;gap:10px;padding:var(--spacing-16);
  border-bottom:var(--border-w) solid var(--color-hairline)}
.side .brand .mark{width:34px;height:34px;flex:0 0 34px;border-radius:var(--radius);
  background:var(--color-eager-green);display:grid;place-items:center;color:#fff}
.side .brand b{font-family:var(--font-feather);font-size:17px;font-weight:800;
  color:var(--color-charcoal);line-height:1.15;display:block}
/* chỉ dòng phụ mới IN HOA — để cả khối thì tên app bị hoa theo */
.side .brand .sub{font-size:11px;font-weight:700;color:var(--color-pencil-gray);
  text-transform:uppercase;letter-spacing:var(--tracking-nav-label)}
.side .grp{font-size:11px;font-weight:700;color:var(--color-faded-gray);
  text-transform:uppercase;letter-spacing:var(--tracking-nav-label);
  padding:var(--spacing-16) var(--spacing-16) 6px}
.side nav{display:flex;flex-direction:column;gap:2px;padding:8px}
.side nav button{
  display:flex;align-items:center;gap:10px;width:100%;text-align:left;
  font-family:var(--font-body);font-weight:var(--font-weight-bold);font-size:15px;
  color:var(--color-charcoal);background:transparent;border:0;border-radius:var(--radius);
  padding:9px 12px;cursor:pointer;line-height:1.2;
}
.side nav button[hidden]{display:none}   /* display:flex đè mất thuộc tính hidden */
.side nav button svg{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;
  stroke-width:2;stroke-linecap:round;stroke-linejoin:round;opacity:.85}
.side nav button:hover{background:#f4f4f4}
.side nav button.on{background:var(--color-storybook-green);color:var(--color-charcoal)}
.side nav button.on svg{opacity:1}
.side .scroll{flex:1;overflow-y:auto;min-height:0}
.side .foot{border-top:var(--border-w) solid var(--color-hairline);padding:10px 12px;
  display:flex;flex-direction:column;gap:8px}
.side .foot a{font-size:var(--text-caption)}

/* thu gọn còn thanh biểu tượng — màn hình hẹp hoặc người dùng tự bấm */
.app.rail .side{width:60px;flex:0 0 60px}
.app.rail .side .brand b, .app.rail .side .brand span,
.app.rail .side nav button span, .app.rail .side .grp,
.app.rail .side .foot a span, .app.rail #chatList{display:none}
.app.rail .side nav button{justify-content:center;padding:10px 0}
#railBtn{margin-left:auto;background:transparent;border:0;cursor:pointer;
  color:var(--color-faded-gray);padding:4px;border-radius:8px;line-height:0}
#railBtn:hover{background:#f4f4f4;color:var(--color-charcoal)}
.app.rail #railBtn{transform:rotate(180deg)}

.content{flex:1;min-width:0;display:flex;flex-direction:column}
.page-head{padding:var(--spacing-24) var(--spacing-24) 0;max-width:var(--page-max-width);
  margin:0 auto;width:100%}
.page-head .eyebrow{font-size:11px;font-weight:700;color:var(--color-faded-gray);
  text-transform:uppercase;letter-spacing:var(--tracking-nav-label)}
.page-head h1{font-family:var(--font-feather);font-size:30px;line-height:1.2;font-weight:800;
  color:var(--color-charcoal);margin:6px 0 4px}
.page-head p{color:var(--color-pencil-gray);font-size:var(--text-caption);margin:0}
main{max-width:var(--page-max-width);margin:0 auto;width:100%;padding:var(--spacing-24)}

/* danh sách hội thoại của Agent, nằm trong sidebar như app chat quen thuộc */
#chatList{display:flex;flex-direction:column;gap:2px;padding:0 8px 8px}
#chatList button{display:flex;align-items:center;gap:8px;width:100%;text-align:left;
  font-family:var(--font-body);font-size:var(--text-caption);font-weight:var(--font-weight-medium);
  color:var(--color-charcoal);background:transparent;border:0;border-radius:var(--radius);
  padding:8px 10px;cursor:pointer}
#chatList button:hover{background:#f4f4f4}
#chatList button.on{background:var(--color-storybook-green);font-weight:var(--font-weight-bold)}
#chatList .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
#chatList .x{opacity:0;color:var(--color-pencil-gray);flex:0 0 auto;font-weight:700;padding:0 2px}
#chatList button:hover .x{opacity:1}

/* ══════════════════ TYPO trong app ══════════════════ */
h2{
  font-size:var(--text-nav-label);line-height:var(--leading-nav-label);
  text-transform:uppercase;letter-spacing:var(--tracking-nav-label);
  font-weight:var(--font-weight-bold);color:var(--color-pencil-gray);
  margin:var(--spacing-32) 0 var(--spacing-12);
}
h2:first-child{margin-top:0}
.muted{color:var(--color-pencil-gray)}
.small{font-size:var(--text-caption);line-height:var(--leading-caption)}
.mono{font-family:ui-monospace,Consolas,monospace;font-size:var(--text-caption)}
a,.link{color:var(--color-spark-blue);font-weight:var(--font-weight-bold);text-decoration:none;cursor:pointer}

/* ══════════════════ CARD / STAT ══════════════════ */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:var(--element-gap);margin-bottom:var(--spacing-24)}
.card{background:var(--color-paper-white);border:var(--border-w) solid var(--color-hairline);
      border-radius:var(--radius);padding:var(--card-padding)}
.card .n{font-family:var(--font-feather);font-size:var(--text-heading-sm);line-height:var(--leading-heading-sm);
         font-weight:800;color:var(--color-charcoal)}
.card .n.good{color:var(--color-eager-green)}
.card .n.bad{color:var(--color-danger)}
.card .l{color:var(--color-pencil-gray);font-size:var(--text-caption);line-height:var(--leading-caption);margin-top:4px}

/* ══════════════════ BUTTON (spec: 12px radius, viền 2px) ══════════════════ */
.btn{
  font-family:var(--font-body);font-weight:var(--font-weight-bold);
  font-size:var(--text-nav-label);text-transform:uppercase;letter-spacing:var(--tracking-nav-label);
  border-radius:var(--radius);padding:9px 16px;cursor:pointer;border:var(--border-w) solid transparent;
  background:var(--color-eager-green);color:var(--color-paper-white);
}
.btn:hover:not(:disabled){filter:brightness(.94)}
.btn:disabled{background:var(--color-faded-gray);border-color:var(--color-faded-gray);cursor:not-allowed}
.btn.ghost{background:transparent;color:var(--color-spark-blue);border-color:var(--color-faded-gray)}
.btn.ghost:hover:not(:disabled){background:#f4fbff}
.btn.ghost:disabled{background:transparent;color:var(--color-faded-gray);border-color:var(--color-hairline)}
.btn.danger{background:transparent;color:var(--color-danger);border-color:var(--color-faded-gray)}
.btn.sm{font-size:var(--text-caption);padding:6px 12px}

/* ══════════════════ FORM ══════════════════ */
select,input[type=text],input:not([type]){
  font-family:var(--font-body);font-size:var(--text-nav-label);font-weight:var(--font-weight-medium);
  color:var(--color-charcoal);background:var(--color-paper-white);
  border:var(--border-w) solid var(--color-faded-gray);border-radius:var(--radius);padding:9px 12px;
}
input[type=checkbox]{width:17px;height:17px;accent-color:var(--color-eager-green);cursor:pointer;margin:0}
label.fld{display:flex;flex-direction:column;gap:4px}
label.fld>span{font-size:var(--text-caption);color:var(--color-pencil-gray);font-weight:var(--font-weight-bold)}

/* ══════════════════ TABLE ══════════════════ */
.wrap{overflow-x:auto;border:var(--border-w) solid var(--color-hairline);border-radius:var(--radius)}
table{width:100%;border-collapse:collapse;background:var(--color-paper-white)}
th,td{padding:11px 14px;text-align:left;font-size:var(--text-caption);line-height:var(--leading-caption);
      border-bottom:1px solid var(--color-hairline)}
th{background:#fafafa;color:var(--color-pencil-gray);font-weight:var(--font-weight-bold);
   text-transform:uppercase;letter-spacing:var(--tracking-nav-label);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover td{background:#fcfdfb}
td.actions{white-space:nowrap;display:flex;gap:var(--spacing-8);flex-wrap:wrap}

/* ══════════════════ TAG / PILL ══════════════════ */
.tag{display:inline-block;border-radius:var(--radius);border:var(--border-w) solid var(--color-faded-gray);
     color:var(--color-pencil-gray);background:var(--color-paper-white);
     padding:1px 9px;font-size:12px;font-weight:var(--font-weight-bold);white-space:nowrap}
.tag.ok{color:var(--color-eager-green);border-color:var(--color-eager-green);background:var(--color-storybook-green)}
.tag.info{color:var(--color-spark-blue);border-color:var(--color-spark-blue)}
.tag.bad{color:var(--color-danger);border-color:var(--color-danger)}

/* chỉ báo job TOÀN CỤC: nằm dưới sidebar nên thấy được ở mọi khu vực, kể cả Agent */
#jobBadge{display:flex;align-items:center;gap:8px;cursor:pointer;width:100%;text-align:left;
  background:var(--color-storybook-green);border:var(--border-w) solid var(--color-eager-green);
  border-radius:var(--radius);padding:8px 10px;font-family:var(--font-body);
  font-size:var(--text-caption);font-weight:var(--font-weight-bold);color:var(--color-charcoal)}
#jobBadge[hidden]{display:none}
#jobBadge .spin{width:13px;height:13px;border:2.5px solid var(--color-eager-green);
  border-top-color:transparent;border-radius:50%;animation:sp .8s linear infinite;flex:0 0 auto}
@keyframes sp{to{transform:rotate(360deg)}}
#jobBadge .txt{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.app.rail #jobBadge .txt{display:none}

/* thanh tiến trình thật (dữ liệu đã có sẵn trong log, chỉ là chưa dùng) */
.prog{height:12px;border-radius:var(--radius);background:#f0f0f0;overflow:hidden;
  border:var(--border-w) solid var(--color-hairline);margin:10px 0 6px}
.prog>i{display:block;height:100%;background:var(--color-eager-green);transition:width .4s ease}
.prog.idle>i{background:var(--color-faded-gray)}
.prog.err>i{background:var(--color-danger)}    /* việc lỗi mà thanh vẫn xanh lá là đọc nhầm ngay */

/* mất kết nối tới server: app đóng gói thì cửa sổ python có thể bị tắt/crash,
   không báo thì mọi nút chỉ "im lặng không làm gì" — người dùng tưởng app hỏng */
#offline{position:fixed;left:50%;transform:translateX(-50%);top:12px;z-index:80;display:none;
  align-items:center;gap:10px;background:var(--color-paper-white);
  border:var(--border-w) solid var(--color-danger);border-radius:var(--radius);
  padding:10px 16px;font-size:var(--text-caption);font-weight:var(--font-weight-bold);
  color:var(--color-charcoal);max-width:92vw}
#offline.on{display:flex}
#offline .dot{width:9px;height:9px;border-radius:50%;background:var(--color-danger);
  animation:bl 1.1s infinite;flex:0 0 auto}

/* xem trước chủ đề */
.pv{display:grid;grid-template-columns:1fr;gap:var(--spacing-12)}
.pv audio{width:100%;height:38px}
.pv .lines{max-height:230px;overflow-y:auto;border:var(--border-w) solid var(--color-hairline);
  border-radius:var(--radius);padding:var(--spacing-12);font-size:var(--text-caption);line-height:1.6}
.pv .lines p{margin:0 0 7px} .pv .lines i{color:var(--color-pencil-gray);font-style:normal;margin-right:8px}
.modal.wide{max-width:680px}
.thumb{width:46px;height:46px;object-fit:contain;border-radius:var(--radius);
  border:var(--border-w) solid var(--color-hairline);background:#fafafa;display:block}
.thumb-none{width:46px;height:46px;border-radius:var(--radius);border:var(--border-w) dashed var(--color-hairline)}
.row.sticky{position:sticky;top:0;z-index:20;background:var(--color-paper-white);
  padding:var(--spacing-12) 0;border-bottom:var(--border-w) solid var(--color-hairline);margin-bottom:var(--spacing-16)}
details.proj{margin-bottom:var(--spacing-16)}
details.proj>summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:var(--spacing-8);
  padding:var(--spacing-12) var(--spacing-16);border:var(--border-w) solid var(--color-hairline);
  border-radius:var(--radius);font-weight:var(--font-weight-bold);color:var(--color-charcoal)}
details.proj>summary::-webkit-details-marker{display:none}
details.proj>summary:hover{background:#fafafa}
details.proj[open]>summary{border-bottom-left-radius:0;border-bottom-right-radius:0;background:var(--color-storybook-green)}
details.proj>.inner{border:var(--border-w) solid var(--color-hairline);border-top:0;
  border-radius:0 0 var(--radius) var(--radius);padding:var(--spacing-16)}
.row{display:flex;gap:var(--element-gap);align-items:center;flex-wrap:wrap;margin-bottom:var(--spacing-16)}
.bar{height:10px;border-radius:var(--radius);background:#f0f0f0;min-width:70px;overflow:hidden;
     border:1px solid var(--color-hairline)}
.bar>i{display:block;height:100%;background:var(--color-eager-green)}
pre{background:#fafafa;border:var(--border-w) solid var(--color-hairline);border-radius:var(--radius);
    padding:var(--spacing-12);overflow:auto;max-height:220px;
    font-family:ui-monospace,Consolas,monospace;font-size:12px;line-height:1.5;margin:var(--spacing-12) 0 0}
.pos{color:var(--color-eager-green);font-weight:var(--font-weight-bold)}
.neg{color:var(--color-danger);font-weight:var(--font-weight-bold)}

/* ══════════════════ EMPTY / SKELETON ══════════════════ */
/* ══════════════════ HOME ══════════════════
   Bố cục lấy ý từ màn hình chính CapCut: một nút TẠO nổi bật hẳn, bên dưới là các
   quy trình, dưới nữa là dự án đã có. Nhưng KHÔNG bê gradient/đổ bóng của CapCut về
   — luật 2 của docs/UI.md: bề mặt phẳng, phân tách bằng viền 2px. */
/* Đầu mục: nhãn mục + hành động chính CÙNG MỘT HÀNG. Trước đây nhãn mục 15px xám
   đứng một mình dưới một khối xanh to đùng -> phân cấp lộn ngược, mắt không biết
   nhìn đâu trước. */
.secthead{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--element-gap);
          flex-wrap:wrap;margin:0 0 var(--element-gap)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:var(--element-gap)}
.tile{text-align:left;width:100%;background:var(--color-paper-white);cursor:pointer;
      border:var(--border-w) solid var(--color-hairline);border-radius:var(--radius);
      padding:var(--card-padding);font-family:var(--font-body);
      display:flex;flex-direction:column;gap:6px}
.tile.san:hover{border-color:var(--color-eager-green);background:var(--color-storybook-green)}
/* Đầu thẻ cố định một hàng: icon trái, nhãn trạng thái phải. Trước đây nhãn "sắp có"
   nằm chung dòng tiêu đề nên thẻ nào tên dài là nó rớt xuống dòng, mỗi thẻ một kiểu. */
.tile .tilehd{display:flex;align-items:center;justify-content:space-between;gap:8px}
.tile .ic{font-size:26px;line-height:1}
.tile b{display:block;color:var(--color-charcoal);font-size:var(--text-subheading);line-height:1.3}
.tile .l{color:var(--color-pencil-gray);font-size:var(--text-caption);line-height:var(--leading-caption)}
/* Quy trình chưa ra mắt: LÀM MỜ chứ không ẩn. Người dùng cần thấy app sẽ đi tới đâu,
   và biết thứ mình đang tìm là chưa có — thay vì đi tìm mòn mỏi trong menu. */
.tile:disabled{cursor:not-allowed;background:#fafafa;border-style:dashed}
.tile:disabled b{color:var(--color-faded-gray)}
.tile:disabled .ic, .tile:disabled .l{opacity:.5}

/* Thẻ dự án / CapCut project */
/* auto-FILL chứ không auto-FIT: chỉ có 1 dự án thì auto-fit kéo thẻ giãn hết chiều
   ngang màn hình, nhìn như một thanh dài chứ không ra cái thẻ. */
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:var(--element-gap)}
.pcard{background:var(--color-paper-white);border:var(--border-w) solid var(--color-hairline);
       border-radius:var(--radius);padding:var(--card-padding);text-align:left;width:100%;
       font-family:var(--font-body);cursor:pointer}
.pcard:hover{border-color:var(--color-spark-blue)}
.pcard b{display:block;color:var(--color-charcoal);font-size:var(--text-subheading);
         margin-bottom:4px;word-break:break-word}
.pcard .l{color:var(--color-pencil-gray);font-size:var(--text-caption)}
.pcard .acts{display:flex;gap:6px;margin-top:10px;flex-wrap:wrap}

/* Thẻ dự án: icon to bên trái để quét mắt theo cột, tên là thứ ĐẬM NHẤT trong thẻ */
.prj .prjhd{display:flex;gap:10px;align-items:flex-start}
.prj .prjhd .ic{font-size:26px;line-height:1.1;flex:0 0 auto}
.prj .prjhd .l{display:block}
/* Số liệu tách hẳn khỏi chữ mô tả: "3 chủ đề · 3 dự án CapCut" trước đây trộn vào
   một dòng xám nên không đọc ra ngay được cái nào là con số đáng quan tâm. */
.prj .stats{display:flex;gap:var(--element-gap);flex-wrap:wrap;margin-top:12px;
            padding-top:12px;border-top:var(--border-w) solid var(--color-hairline)}
.prj .stats span{font-size:var(--text-caption);color:var(--color-pencil-gray)}
.prj .stats b{display:inline;font-family:var(--font-feather);font-size:20px;
              font-weight:800;color:var(--color-charcoal);margin-right:4px}

/* ══════════════════ MÀN HÌNH LÀM VIỆC ══════════════════ */
.workbar{display:flex;align-items:center;gap:var(--element-gap);flex-wrap:wrap;
         margin-bottom:var(--element-gap)}

/* Cài đặt dự án: gập lại. Ba bước này chỉ làm MỘT LẦN lúc lập dự án, mà trước đây
   chiếm nguyên phần trên màn hình nên thứ dùng hằng ngày (chủ đề) bị đẩy xuống. */
.setup{border:var(--border-w) solid var(--color-hairline);border-radius:var(--radius);
       background:var(--color-paper-white)}
.setup>summary{cursor:pointer;list-style:none;padding:var(--card-padding);
       display:flex;align-items:center;gap:var(--element-gap);flex-wrap:wrap}
.setup>summary::-webkit-details-marker{display:none}
.setup>summary::before{content:'▸';color:var(--color-pencil-gray);font-size:14px;flex:0 0 auto}
.setup[open]>summary::before{content:'▾'}
.setup>summary .tit{font-weight:var(--font-weight-bold);color:var(--color-charcoal);
       font-size:var(--text-subheading)}
.setup>summary .sum{color:var(--color-pencil-gray);font-size:var(--text-caption);
       margin-left:auto;text-align:right;word-break:break-word}
.setup:not([open])>summary:hover{background:#fafafa;border-radius:var(--radius)}
.setup .inner{padding:0 var(--card-padding) var(--card-padding);
       border-top:var(--border-w) solid var(--color-hairline)}
/* Nhãn nhóm bên trong khối gập — nhỏ hơn h2 để không tranh chấp với nhãn mục ngoài */
.setup h3.sub{font-size:var(--text-caption);font-weight:var(--font-weight-bold);
       color:var(--color-charcoal);text-transform:none;letter-spacing:0;
       margin:var(--spacing-16) 0 8px}

/* Công tắc lớp: lưới cố định, nhãn KHÔNG rớt dòng. Trước đây dùng .tiles nên nhãn
   dài như "Hiệu ứng tiếng (SFX)" gãy làm hai dòng, mỗi ô một chiều cao. */
.lopgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:8px}
.lop{display:flex;align-items:center;gap:8px;padding:8px 10px;cursor:pointer;
     border:var(--border-w) solid var(--color-hairline);border-radius:var(--radius);
     font-size:var(--text-caption);color:var(--color-charcoal)}
.lop:hover{border-color:var(--color-faded-gray)}
.lop input{flex:0 0 auto}
.lop span{min-width:0}

/* Lời thoại: bảng dày, cỡ chữ caption và mốc giờ canh cột để quét mắt theo cột dọc */
.tslist{max-height:56vh;overflow:auto;border:var(--border-w) solid var(--color-hairline);
        border-radius:var(--radius)}
.tsrow{display:flex;gap:10px;padding:7px 10px;font-size:var(--text-caption);
       line-height:var(--leading-caption);border-bottom:1px solid var(--color-hairline)}
.tsrow:last-child{border-bottom:0}
.tsrow .t{flex:0 0 46px;color:var(--color-pencil-gray)}
.tsrow .w{min-width:0;color:var(--color-charcoal)}
/* Dòng AI ĐÃ SỬA CHỮ được đánh dấu, kèm bản thô ngay dưới — người dùng soi được nó
   sửa đúng hay sửa bậy, thay vì phải tin. */
.tsrow.doi{background:#fbfff5}
/* Dòng bị coi là không có nội dung: làm mờ chứ KHÔNG ẩn — người dùng phải soi được
   AI có bỏ nhầm câu hay không, mà ẩn đi thì chẳng ai kiểm được. */
.tsrow.bo .w{color:var(--color-faded-gray)}
.tsrow.bo{background:#fafafa}
.tsrow .goc{display:block;color:var(--color-pencil-gray);text-decoration:line-through;
            margin-top:2px}

/* Thẻ chủ đề: cao bằng nhau để so sánh được theo hàng, nút luôn nằm đáy thẻ */
.tcard{display:flex;flex-direction:column}
.tcard b{flex:0 0 auto;line-height:1.3}
.tcard .acts{margin-top:auto;padding-top:10px}

/* Phân trang — 16 chủ đề đổ một trang thì phải cuộn mãi mới so sánh được */
.pager{display:flex;gap:6px;justify-content:center;flex-wrap:wrap;
       margin-top:var(--element-gap)}

/* Hộp thoại cân bằng âm thanh cần rộng hơn cả .wide: bảng LUFS nhiều cột, nhét vào
   modal hỏi-đáp mặc định (460px) là cuộn ngang liên tục. Dùng .wide có sẵn để
   closeModal() tự gỡ giúp, chỉ nới thêm cho đúng nội dung dạng bảng. */
.modal.wide.bang{max-width:min(900px, 94vw)}

/* ══════════════════ THANH GẠT chế độ (Thường | Agent chat) ══════════════════
   Trước đây Agent là một mục trong sidebar, nằm lẫn với các khu vực — mà nó không
   phải "khu vực", nó là CHẾ ĐỘ nhìn cùng dữ liệu theo cách khác. Thanh gạt nói đúng
   quan hệ đó, và luôn thấy được. */
.modesw{display:flex;gap:4px;padding:4px;margin-bottom:var(--element-gap);
        background:var(--color-paper-white);border:var(--border-w) solid var(--color-hairline);
        border-radius:var(--radius)}
.modesw button{flex:1;border:0;background:transparent;border-radius:8px;cursor:pointer;
        font-family:var(--font-body);font-weight:var(--font-weight-bold);font-size:var(--text-caption);
        color:var(--color-pencil-gray);padding:7px 6px;display:flex;align-items:center;
        justify-content:center;gap:6px}
.modesw button.on{background:var(--color-storybook-green);color:var(--color-charcoal)}
.modesw button svg{width:15px;height:15px;fill:none;stroke:currentColor;stroke-width:2;
        stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.app.rail .modesw{flex-direction:column}
.app.rail .modesw button span{display:none}

.empty{border:var(--border-w) dashed var(--color-faded-gray);border-radius:var(--radius);
       padding:var(--spacing-32);text-align:center;color:var(--color-pencil-gray)}
.empty b{display:block;color:var(--color-charcoal);font-size:var(--text-subheading);margin-bottom:6px}
.skel{background:linear-gradient(90deg,#f2f2f2 25%,#e9e9e9 37%,#f2f2f2 63%);
      background-size:400% 100%;animation:sk 1.2s ease-in-out infinite;border-radius:var(--radius);height:74px}
@keyframes sk{0%{background-position:100% 50%}100%{background-position:0 50%}}

/* ══════════════════ TOAST ══════════════════ */
#toasts{position:fixed;right:20px;bottom:20px;display:flex;flex-direction:column;gap:var(--spacing-8);z-index:60}
.toast{background:var(--color-paper-white);border:var(--border-w) solid var(--color-eager-green);
       border-radius:var(--radius);padding:12px 16px;max-width:380px;font-size:var(--text-caption);
       color:var(--color-charcoal);animation:tin .18s ease-out}
.toast.bad{border-color:var(--color-danger)}
@keyframes tin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}

/* ══════════════════ MODAL (thay alert/confirm/prompt) ══════════════════ */
#veil{position:fixed;inset:0;background:rgba(0,4,55,.35);display:none;align-items:center;justify-content:center;z-index:70;padding:20px}
#veil.on{display:flex}
.modal{background:var(--color-paper-white);border:var(--border-w) solid var(--color-faded-gray);
       border-radius:var(--radius);padding:var(--spacing-24);max-width:460px;width:100%}
.modal h3{font-family:var(--font-feather);font-size:var(--text-subheading);margin:0 0 var(--spacing-12);color:var(--color-charcoal)}
.modal .body{font-size:var(--text-caption);color:var(--color-pencil-gray);margin-bottom:var(--spacing-16);white-space:pre-wrap}
.modal .acts{display:flex;gap:var(--spacing-8);flex-wrap:wrap;justify-content:flex-end}

/* ══════════════════ CHAT ══════════════════ */
#chat{display:flex;flex-direction:column;gap:var(--spacing-12);min-height:300px;max-height:56vh;overflow-y:auto;
      background:var(--color-paper-white);border:var(--border-w) solid var(--color-hairline);
      border-radius:var(--radius);padding:var(--spacing-16)}
.bub{max-width:76%;padding:11px 15px;border-radius:var(--radius);white-space:pre-wrap;font-size:var(--text-caption);line-height:1.55}
.bub.u{align-self:flex-end;background:var(--color-eager-green);color:var(--color-paper-white);font-weight:var(--font-weight-bold)}
.bub.a{align-self:flex-start;background:var(--color-paper-white);border:var(--border-w) solid var(--color-hairline)}
.tools{align-self:flex-start;display:flex;gap:6px;flex-wrap:wrap}
.dots span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--color-faded-gray);animation:bl 1.1s infinite}
.dots span:nth-child(2){animation-delay:.18s} .dots span:nth-child(3){animation-delay:.36s}
@keyframes bl{0%,80%{opacity:.3}40%{opacity:1}}
.chips{display:flex;gap:var(--spacing-8);flex-wrap:wrap;margin-top:var(--spacing-12)}
.chip{border:var(--border-w) solid var(--color-faded-gray);border-radius:var(--radius);padding:6px 12px;
      font-size:var(--text-caption);color:var(--color-spark-blue);font-weight:var(--font-weight-bold);
      background:transparent;cursor:pointer;font-family:var(--font-body)}
.chip:hover{background:#f4fbff}

@media(max-width:900px){          /* màn hẹp: sidebar tự co còn thanh biểu tượng */
  .side{width:60px;flex:0 0 60px}
  .side .brand b, .side .brand span, .side nav button span,
  .side .grp, #chatList, #railBtn{display:none}
  .side nav button{justify-content:center;padding:10px 0}
  #jobBadge .txt{display:none}
  main, .page-head{padding-left:var(--spacing-16);padding-right:var(--spacing-16)}
  .bub{max-width:92%}
}
</style>
</head>
<body>

<div class="app" id="app">
<aside class="side">
  <div class="brand">
    <span class="mark"><svg viewBox="0 0 24 24" width="18" height="18" fill="currentColor"><path d="M9 7.5 18 12l-9 4.5z"/></svg></span>
    <span style="min-width:0"><b>CapCut Auto</b><span class="sub">Editor</span></span>
    <button id="railBtn" title="Thu gọn thanh bên" aria-label="Thu gọn thanh bên">

  <div class="scroll">
    <div class="modesw" role="tablist" aria-label="Chế độ">
      <button id="mManualBtn" class="on" role="tab" aria-selected="true">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg><span>Thường</span></button>
      <button id="mAgent" role="tab" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 8.6 8.6 0 0 1-3.8-.9L3 20.5l1.5-4.2a8.4 8.4 0 0 1 3.6-11.6 8.6 8.6 0 0 1 12.9 6.8z"/></svg><span>Agent chat</span></button>
    </div>

    <!-- Gói cả hai nhóm điều hướng vào một khối: chế độ Agent ẩn nguyên khối này.
         Để lộ "Khu vực"/"Hệ thống" trong lúc chat là nói dối về trạng thái — bấm vào
         là văng khỏi cuộc trò chuyện, mà không mục nào đang sáng cả. -->
    <div id="navAreas">

      <button data-t="over" role="tab" aria-controls="over" aria-selected="false">
        <svg viewBox="0 0 24 24"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="M7 4v16M17 4v16M2 10h20M2 14h20"/></svg><span>Tổng quan</span></button>
      <button data-t="lib" role="tab" aria-controls="lib" aria-selected="false">
        <svg viewBox="0 0 24 24"><path d="M21 8v12H3V8"/><rect x="1" y="3" width="22" height="5"/><path d="M10 12h4"/></svg><span>Quản lý tài nguyên</span></button>
    </nav>

    <div class="grp">Hệ thống</div>
    <nav>
      <button data-t="setup" role="tab" aria-controls="setup" aria-selected="false">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2 2 2 0 1 1-4 0 1.7 1.7 0 0 0-2.9-1.2l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1A1.7 1.7 0 0 0 3 15a2 2 0 1 1 0-4 1.7 1.7 0 0 0 1.2-2.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1A1.7 1.7 0 0 0 10 4.6a2 2 0 1 1 4 0 1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1A1.7 1.7 0 0 0 21 11a2 2 0 1 1 0 4z"/></svg><span>Cài đặt</span></button>
    </nav>
    </div>

    <nav>
      <button id="btnNewChat" hidden>
        <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>Trò chuyện mới</span></button>

    <div id="chatList"></div>
  </div>

  <div class="foot">
    <button id="jobBadge" hidden></button>
    <a class="link small" id="mManual" style="display:none">← Về khu vực làm việc</a>
  </div>
</aside>

<div class="content">
  <div class="page-head">
    <div class="eyebrow">CapCut Auto Editor</div>

    <section id="home" role="tabpanel"></section>
    <section id="over" role="tabpanel" hidden></section>

      <div id="chat"></div>
      <div class="row" style="margin-top:12px">
        <input id="msg" style="flex:1;min-width:300px" aria-label="Câu lệnh cho agent"
               placeholder="vd: dựng chủ đề điểm cao nhất của 2006 theo gu Đan">

<div id="veil"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mdTitle" tabindex="-1">
  <h3 id="mdTitle"></h3><div class="body" id="mdBody"></div><div class="acts" id="mdActs"></div>
</div></div>

<script>
const $ = s => document.querySelector(s);
/* escape cả nháy: tên draft/tài nguyên được nhét vào thuộc tính HTML, một dấu
   nháy trong tên là vỡ cả bảng. */
const esc = s => String(s??'').replace(/[<>&"']/g,
  c => ({'<':'&lt;','>':'&gt;','&':'&amp;','"':'&quot;',"'":'&#39;'}[c]));

/* ---------- nhớ lựa chọn giữa các lần mở app ----------
   Bắt editor chọn lại thư mục record + gu + tab mỗi lần mở là bắt họ làm việc
   không công, ngày mấy chục lần. */
const PREF = {
  get(k, d){ try{ const v = localStorage.getItem('cc.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem('cc.'+k, JSON.stringify(v)); }catch(e){} },
};

/* ---------- gọi API ----------
   Mọi lỗi MẠNG quy về một banner. App đóng gói thì cửa sổ python có thể bị tắt
   hoặc crash — không báo thì mọi nút chỉ "im lặng không làm gì", người dùng
   tưởng app hỏng và bấm loạn lên. */
/* Việc nặng (bóc lời) ăn hết CPU nên server thỉnh thoảng trả lời chậm -> một lượt
   hỏi trượt là chuyện bình thường. Báo "mất kết nối" ngay lần đầu thì banner đỏ
   nhấp nháy suốt lúc đang phân tích, làm người dùng tưởng app chết. Chỉ báo khi
   trượt LIÊN TIẾP. */
let OFFLINE = false, TRUOT = 0;
const NGUONG_TRUOT = 3;
function setOffline(v){
  if(v){
    TRUOT++;
    if(TRUOT < NGUONG_TRUOT || OFFLINE) return;
  } else {
    TRUOT = 0;
    if(!OFFLINE) return;
  }
  OFFLINE = v; $('#offline').classList.toggle('on', v);
  if(!v) toast('Đã kết nối lại');
}
async function api(u, o){
  let r;
  try{ r = await fetch(u, o); }
  catch(e){ setOffline(true); throw 'Không gọi được app — mất kết nối'; }
  setOffline(false);
  if(r.ok) return r.json();
  throw await r.json().then(e => e.detail || ('Lỗi ' + r.status)).catch(() => 'Lỗi ' + r.status);
}

/* ---------- 4 trạng thái bắt buộc của một khu vực (docs/UI.md mục 6) ----------
   Trước đây loader nào lỗi là skeleton nằm lại vĩnh viễn — nhìn y như app treo,
   mà lỗi thật (thiếu ffmpeg, sai đường dẫn draft) thì không ai đọc được. */
const RETRY = {};
async function guard(sel, load){
  RETRY[sel] = () => guard(sel, load);
  try{ await load(); }
  catch(e){
    $(sel).innerHTML = `<div class="empty"><b>Không tải được khu vực này</b>${esc(String(e))}</div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ghost" data-act="retry" data-sel="${sel}">Thử lại</button></div>`;
  }
}

/* Nút chạy việc nặng phải KHOÁ trong lúc chạy. Bấm hai lần "Tạo draft" là dựng
   đè lên chính nó; bấm hai lần "Phân tích" là hai job giành cùng một GPU. */
async function busy(btn, label, fn){
  if(btn && btn.disabled) return;             // (gọi không kèm nút vẫn chạy: hành động
  const old = btn && btn.textContent;         //  trong hộp thoại không có nút để khoá)
  if(btn){ btn.disabled = true; btn.textContent = label; }
  try{ return await fn(); }
  finally{ if(btn){ btn.disabled = false; btn.textContent = old; } }
}

/* Xin quyền thông báo ĐÚNG LÚC bắt đầu việc chạy lâu, không phải ngay cú bấm
   đầu tiên vào app — hỏi khi chưa có việc gì thì ai cũng bấm "Chặn". */
function askNotify(){
  try{ if(window.Notification && Notification.permission === 'default') Notification.requestPermission(); }
  catch(e){}
}

/* Hành động trong bảng đi qua data-act, KHÔNG dùng onclick="fn('${name}')":
   tên draft có dấu nháy là hỏng handler, và nội dung từ server không nên
   biến thành mã chạy được. */
const ACTIONS = {};
document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if(!el || el.disabled) return;
  const f = ACTIONS[el.dataset.act];
  if(!f) return;
  e.preventDefault();
  f(el.dataset, el);
});

/* ---------- toast: thay alert() ---------- */
function toast(msg, bad){
  const d = document.createElement('div');
  d.className = 'toast' + (bad?' bad':''); d.textContent = msg;
  $('#toasts').appendChild(d);
  setTimeout(()=>{ d.style.opacity='0'; d.style.transition='opacity .3s'; setTimeout(()=>d.remove(),300); }, bad?6000:3600);
}
/* ---------- modal: thay confirm() / prompt() ----------
   MỘT chỗ xử lý đóng cho MỌI hộp thoại. Trước đây preview() tự mở veil mà không
   đăng ký Esc -> veil kẹt lại chặn hết click của cả trang. */
let MODAL_CLOSE = null, MODAL_PREV = null;
function openVeil(){
  MODAL_PREV = document.activeElement;      // đóng hộp thoại phải trả tiêu điểm về
  $('#veil').classList.add('on');            // đúng chỗ vừa bấm, không nhảy về đầu trang
}
function closeModal(){
  $('#veil').classList.remove('on');
  document.querySelector('.modal').classList.remove('wide', 'bang');
  const f = MODAL_CLOSE; MODAL_CLOSE = null; if(f) f();
  if(MODAL_PREV && MODAL_PREV.isConnected) MODAL_PREV.focus();
  MODAL_PREV = null;
}
document.addEventListener('keydown', e=>{
  if(!$('#veil').classList.contains('on')) return;
  if(e.key === 'Escape'){ closeModal(); return; }
  if(e.key === 'Tab'){                       // giữ tiêu điểm trong hộp thoại
    const f = [...document.querySelectorAll('#veil button, #veil audio, #veil [href]')];
    if(!f.length) return;
    const first = f[0], last = f[f.length-1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  }
});
$('#veil').addEventListener('click', e=>{ if(e.target===$('#veil')) closeModal(); });
function modal({title, body='', actions}){
  return new Promise(resolve=>{
    $('#mdTitle').textContent = title;
    $('#mdBody').textContent = body;
    const box = $('#mdActs'); box.innerHTML = '';
    MODAL_CLOSE = () => resolve(null);
    const pick = v => { MODAL_CLOSE = null; closeModal(); resolve(v); };
    const acts = actions || [{label:'Đóng', value:null}];
    /* Tiêu điểm KHÔNG được rơi vào nút phá huỷ: hộp "Ghi đè draft" mà focus sẵn
       nút Ghi đè thì một phát Enter theo phản xạ là mất bản editor vừa sửa. */
    const safe = Math.max(0, acts.findIndex(a => a.style !== 'danger'));
    acts.forEach((a,i)=>{
      const b = document.createElement('button');
      b.className = 'btn' + (a.style==='ghost'?' ghost':'') + (a.style==='danger'?' danger':'');
      b.textContent = a.label; b.onclick = ()=>pick(a.value);
      box.appendChild(b); if(i===safe) setTimeout(()=>b.focus(),30);
    });
    openVeil();
  });
}
const confirmBox = (title, body) => modal({title, body, actions:[
  {label:'Đồng ý', value:true}, {label:'Huỷ', value:false, style:'ghost'}]});

const skeleton = n => `<div class="cards">${'<div class="skel"></div>'.repeat(n||4)}</div>`;
const emptyBox = (title, hint) => `<div class="empty"><b>${esc(title)}</b>${esc(hint||'')}</div>`;

/* ---------- chuyển chế độ / tab ----------
   Tab và chế độ được NHỚ: người dùng ở tab Âm thanh cả buổi, mỗi lần Ctrl+F5
   lại bị ném về tab Dự án là mất mạch việc. */
const SECTS = ['home','over','work','lib','setup'];
/* 'work' (màn hình làm việc của một dự án) KHÔNG có mục trên sidebar: nó luôn đi
   kèm một dự án cụ thể, vào bằng cách bấm thẻ ở Home. Đặt nó thành mục điều hướng
   thì lúc chưa chọn dự án nào sẽ chẳng biết hiện cái gì. */
const LOADERS = {home:loadHome, over:loadOver, work:loadWork, lib:loadLib, setup:loadSetup};
const NUT_TAB = () => document.querySelectorAll('.side button[data-t]');
/* Tiêu đề trang nằm ở một chỗ: sidebar chỉ còn nhãn ngắn, câu giải thích "khu vực
   này để làm gì" chuyển lên đầu trang — người mới mở app đọc là hiểu ngay. */
const PAGES = {
  home: ['Home', 'Chọn một quy trình để bắt đầu dự án mới, hoặc mở lại dự án đang làm dở.'],
  over: ['Tổng quan', 'Mọi dự án CapCut đã dựng, và những chủ đề còn chờ dựng draft.'],
  work: ['Màn hình làm việc', 'Nạp record, chọn tài nguyên, duyệt chủ đề, dựng draft.'],
  lib:  ['Quản lý tài nguyên', 'Gu từng editor, kiểm kê tài nguyên CapCut trên máy, cài thứ còn thiếu.'],
  setup:['Cài đặt', 'API key để app chạy được. Lưu vào máy bạn, áp dụng ngay, không cần khởi động lại.'],
  agent:['Agent chat', 'Ra lệnh bằng tiếng Việt — agent tự chọn việc, tự hỏi khi thiếu thông tin, và nhớ ngữ cảnh.'],
};
function setPage(k){ $('#pgTitle').textContent = PAGES[k][0]; $('#pgSub').textContent = PAGES[k][1]; }
let TAB = PREF.get('tab', 'home');
function showTab(t){
  if(!LOADERS[t]) t = 'home';
  /* 'work' không lưu vào PREF: mở lại app mà rơi thẳng vào màn hình làm việc của
     một dự án có thể đã bị xoá thì rất khó hiểu. Về Home là điểm xuất phát an toàn. */
  TAB = t; if(t !== 'work') PREF.set('tab', t);
  PREF.set('agent', false);
  NUT_TAB().forEach(x => {                      // gồm cả mục Cài đặt ở nhóm Hệ thống
    const on = x.dataset.t === t;
    x.classList.toggle('on', on); x.setAttribute('aria-selected', on);
  });
  $('#mAgent').classList.remove('on'); $('#mAgent').setAttribute('aria-selected', false);
  $('#mManualBtn').classList.add('on'); $('#mManualBtn').setAttribute('aria-selected', true);
  $('#agent').hidden = true;
  $('#navAreas').hidden = false;
  $('#btnNewChat').hidden = true;
  $('#chatList').innerHTML = '';
  $('#mManual').style.display = 'none';
  SECTS.forEach(s => $('#'+s).hidden = (s !== t));
  setPage(t);
  guard('#'+t, LOADERS[t]);
}
NUT_TAB().forEach(b => b.onclick = () => showTab(b.dataset.t));
function setMode(agentMode){
  if(!agentMode) return showTab(TAB === 'work' ? 'home' : TAB);
  PREF.set('agent', true);
  NUT_TAB().forEach(x => { x.classList.remove('on'); x.setAttribute('aria-selected', false); });
  $('#mAgent').classList.add('on'); $('#mAgent').setAttribute('aria-selected', true);
  $('#mManualBtn').classList.remove('on'); $('#mManualBtn').setAttribute('aria-selected', false);
  $('#navAreas').hidden = true;          // chat thì chỉ còn danh sách trò chuyện
  $('#btnNewChat').hidden = false;
  $('#mManual').style.display = '';
  SECTS.forEach(t => $('#'+t).hidden = true);
  $('#agent').hidden = false;
  setPage('agent');
  loadChat(); loadChatList();
}
$('#mManual').onclick    = ()=>setMode(false);
$('#mManualBtn').onclick = ()=>setMode(false);
$('#mAgent').onclick     = ()=>setMode(true);
ACTIONS.retry = d => RETRY[d.sel] && RETRY[d.sel]();

/* Hộp NHẬP CHỮ. docs/UI.md nói ưu tiên cho chọn bằng nút thay vì bắt gõ — nhưng
   đặt tên dự án thì không có cách nào khác. Vẫn đi qua veil chung để giữ Esc,
   bấm-ra-ngoài, và trả tiêu điểm về đúng nút vừa bấm. */
function promptBox({title, body='', value='', ok='Lưu'}){
  return new Promise(resolve=>{
    $('#mdTitle').textContent = title;
    $('#mdBody').innerHTML = `${body?`<div style="margin-bottom:10px">${esc(body)}</div>`:''}
      <input id="mdInput" style="width:100%" value="${esc(value)}">`;
    const box = $('#mdActs'); box.innerHTML = '';
    MODAL_CLOSE = () => resolve(null);
    const pick = v => { MODAL_CLOSE = null; closeModal(); resolve(v); };
    const inp = $('#mdInput');
    const bOk = document.createElement('button');
    bOk.className = 'btn'; bOk.textContent = ok;
    bOk.onclick = () => pick(inp.value.trim() || null);
    const bHuy = document.createElement('button');
    bHuy.className = 'btn ghost'; bHuy.textContent = 'Huỷ'; bHuy.onclick = () => pick(null);
    box.appendChild(bOk); box.appendChild(bHuy);
    inp.onkeydown = e => { if(e.key === 'Enter'){ e.preventDefault(); bOk.click(); } };
    openVeil();
    setTimeout(()=>{ inp.focus(); inp.select(); }, 30);
  });
}

/* ---------- hành động của Home / màn hình làm việc ---------- */

     thì họ sẽ không dám bấm; tưởng chỉ ẩn đi mà mất thật thì còn tệ hơn. */

      + 'Muốn xoá hẳn dữ liệu thì xoá thủ công trong thư mục shorts/work/.')) return;
  try{

/* Thu gọn sidebar: máy dựng hay chạy CapCut cạnh app, ai cũng cần thêm bề ngang */

/* ══════════════════ TAB: CÀI ĐẶT ══════════════════
   Người dùng không sửa .env bằng tay. Nhập ở đây, app ghi file và áp dụng NGAY.

/* ══════════════════ TAB: TỔNG QUAN ══════════════════
   Trả lời hai câu CapCut không trả lời được: "máy tôi đang có sẵn những gì?" và
   "việc gì đang dở?". Tài nguyên trong cache CapCut phần lớn do CapCut TỰ tải khi
   người dùng duyệt panel — nên tuyệt đối không đóng khung là "bạn tải về rồi bỏ
   phí"; giá trị nằm ở chỗ chúng đã có sẵn trên đĩa, dùng được ngay. */
const MB = n => `${((n||0)/1e6).toFixed(0)} MB`;
const KIND_SHORT = ['sticker','hiệu ứng chữ','mẫu chữ','transition','hiệu ứng','filter'];
let INV_KIND = PREF.get('invKind', '');
/* Kiểm kê tài nguyên CapCut ĐÃ CHUYỂN từ Tổng quan sang Quản lý tài nguyên: nó nói
   về những gì máy đang có, không phải về việc đang dở — để ở Tổng quan thì trang đó
   vừa kể việc vừa kể kho, không có tiêu điểm. */
async function loadInv(){
  const box = $('#invBox'); if(!box) return;
  box.innerHTML = skeleton(4);
  const [ov, inv] = await Promise.all([api('/api/overview'),
    api('/api/inventory?used=no&limit=40&kind=' + encodeURIComponent(KIND_SHORT.join(',')))]);
  const s = inv.stats;
  const chuaQuet = !s.scanned_at;
  const card = (n, l, cls, act) => `<div class="card"${act?` data-act="${act}" style="cursor:pointer"`:''}>
      <div class="n ${cls||''}">${n}</div><div class="l">${l}</div></div>`;
  box.innerHTML = `
    <h2>Tài nguyên CapCut có sẵn trên máy này</h2>
    ${chuaQuet ? emptyBox('Chưa kiểm kê lần nào',
        'Bấm "Quét tài nguyên" để xem máy này đang có sẵn những gì — mất khoảng 15 giây.')
    : `<div class="cards">
      ${card(s.n_assets, `gói tài nguyên · ${MB(s.size)}`)}
      ${card(s.n_used, `đã dùng trong draft · ${MB(s.size_used)}`, 'good')}
      ${card(s.n_unused, `CÓ SẴN chưa dùng · ${MB(s.size_unused)}`, '')}
      ${card(s.n_internal, `module nội bộ CapCut · ${MB(s.size_internal)}`, 'muted')}
    </div>
    <p class="muted small">Phần lớn số này do <b>CapCut tự tải khi bạn duyệt panel</b>, không phải bạn bấm tải —
      nên "chưa dùng" không phải lỗi ai cả. Điều đáng nói: chúng <b>đã nằm sẵn trên đĩa</b>, dựng draft là
      dùng được ngay, không cần tải. Module nội bộ (${s.n_internal} gói) là thứ CapCut tự dùng, không tính là tài nguyên.</p>
    <div class="wrap"><table>
      <thead><tr><th>Loại</th><th>Gói</th><th>Dung lượng</th><th>Đã dùng</th><th>Tỷ lệ dùng</th></tr></thead>
      <tbody>${s.by_kind.map(k=>`<tr>
        <td><span class="tag">${esc(k.kind||'—')}</span></td>
        <td class="mono">${k.n}</td><td class="mono">${MB(k.sz)}</td>
        <td class="mono ${k.used?'pos':''}">${k.used}</td>
        <td><div class="bar" style="min-width:110px"><i style="width:${k.n?k.used/k.n*100:0}%"></i></div></td>
      </tr>`).join('')}</tbody></table></div>`}
    <div class="row" style="margin-top:12px">
      <button class="btn" id="btnScanInv">Quét tài nguyên</button>
      <span class="muted small">${s.scanned_at?`kiểm kê lúc ${vnTime(s.scanned_at*1000)}`:'chưa quét lần nào'}
        · nguồn: ${esc(ov.capcut.source)}</span>
    </div>

    ${chuaQuet ? '' : `
    <h2>Dọn tài nguyên tải thử rồi không dùng</h2>
    <div id="cleanBox"></div>

    <h2>Có sẵn mà chưa dùng — thử ngay không cần tải</h2>
    <div class="row">
      <label class="fld"><span>Loại</span><select id="invKind">
        <option value="">dùng được cho short (${KIND_SHORT.length} loại)</option>
        ${s.by_kind.map(k=>`<option value="${esc(k.kind)}" ${k.kind===INV_KIND?'selected':''}>${esc(k.kind)} (${k.n})</option>`).join('')}
      </select></label>
      <span class="muted small">Kho gu mới học ${ov.lib.n} tài nguyên${ov.owners.length?` (${ov.owners.map(o=>`${esc(o.owner)} ${o.n}`).join(' · ')})`:''} —
        còn ${s.n_unused} gói nữa đang nằm chờ trên máy.</span>
    </div>
    <div id="invRows"></div>`}`;
  $('#btnScanInv').onclick = e => busy(e.currentTarget, 'Đang quét…', async () => {
    try{
      const r = await api('/api/inventory/scan', {method:'POST'});
      toast('Đang kiểm kê tài nguyên trên máy…');
      JOB_DONE_CB[r.job] = () => { if(!$('#lib').hidden) loadInv(); };
      startPolling();
    }catch(e){ toast(String(e), true); }
  });
  if($('#invKind')){
    $('#invKind').onchange = e => { INV_KIND = e.target.value; PREF.set('invKind', INV_KIND); invRows(); };
    invRows(inv.rows);
  }
  if($('#cleanBox')) cleanBox();

/* CapCut KHÔNG cho xoá tài nguyên đã tải: bấm thử vài sticker là chúng nằm lại

   không xoá thẳng, vì đây là dữ liệu của người dùng chứ không phải rác của ta. */
const CLEAN_KINDS = 'làm đẹp,chưa rõ,filter';
let CLEAN_SEL = new Set();      // gói người dùng tự tích để xoá lẻ
async function cleanBox(){
  const box = $('#cleanBox'); if(!box) return;
  box.innerHTML = '<p class="muted small">Đang tính…</p>';
  try{
    const d = await api('/api/cleanup?kinds=' + encodeURIComponent(CLEAN_KINDS));
    CLEAN_SEL = new Set([...CLEAN_SEL].filter(r => d.rows.some(x => x.resource_id === r)));
    const lo = d.batches.map(b=>`<tr>
        <td class="mono">${esc(b.batch)}</td><td class="mono">${b.n} gói</td>
        <td class="mono">${MB(b.freed)}</td><td class="mono muted">${vnTime(b.ts*1000)}</td>
        <td class="actions">
          <button class="btn ghost sm" data-act="cleanUndo" data-batch="${esc(b.batch)}">Trả lại CapCut</button>
          <button class="btn danger sm" data-act="cleanPurge" data-batch="${esc(b.batch)}">Xoá hẳn</button>
        </td></tr>`).join('');
    box.innerHTML = `
      <p class="muted small">Nhắm vào nhóm <b>làm đẹp · chưa rõ · filter</b> — thứ CapCut tự tải
        hoặc bạn bấm thử rồi không dùng cho bản final. Sticker/hiệu ứng chữ/transition
        <b>không đụng tới</b>, kể cả khi chưa dùng, vì đó là đồ bạn có thể cần.
        Gói đang dùng trong bất kỳ draft nào (kể cả timeline lồng) luôn được giữ.</p>
      <div class="row">
        <button class="btn" id="btnClean" ${d.n && !d.capcut_running ? '' :
          `disabled title="${d.capcut_running?'Đóng CapCut trước đã':'Không có gì để dọn'}"`}>
          Dọn cả nhóm · ${d.n} gói · ${MB(d.size)}</button>
        <button class="btn ghost" id="btnCleanSel" disabled title="Chưa tích gói nào">Dọn mục đã tích</button>
        <span class="muted small">${d.capcut_running
          ? '<span class="neg">CapCut đang mở — đóng hẳn rồi dọn.</span>'
          : 'Gói được chuyển sang khu cách ly, hoàn tác bất cứ lúc nào.'}</span>
      </div>
      <div class="wrap" style="margin-top:12px"><table>
        <thead><tr>
          <th style="width:34px"><input type="checkbox" id="cleanAll" title="Tích tất cả đang hiện"></th>

        <tbody>${d.rows.map(r=>`<tr>
          <td><input type="checkbox" class="ckClean" value="${esc(r.resource_id)}"
               ${CLEAN_SEL.has(r.resource_id)?'checked':''}></td>
          <td>${r.has_thumb?`<img class="thumb" loading="lazy" src="/api/inventory/${esc(r.resource_id)}/thumb" alt="">`
                           :'<div class="thumb-none"></div>'}</td>
          <td><span class="tag">${esc(r.kind_guess)}</span></td>
          <td>${esc(r.name_internal||'') || `<span class="mono muted">${esc(r.resource_id)}</span>`}</td>
          <td class="mono">${MB(r.size)}</td>
          <td class="mono muted">${r.mtime?vnTime(r.mtime*1000):'—'}</td>
        </tr>`).join('')}</tbody></table></div>
      <p class="muted small">Hiện ${d.rows.length}/${d.n} gói (nặng nhất trước). Tích từng dòng để dọn lẻ,
        hoặc bấm "Dọn cả nhóm" cho toàn bộ ${d.n} gói.</p>
      ${lo?`<div class="wrap" style="margin-top:12px"><table>
        <thead><tr><th>Lô đã cách ly</th><th>Số gói</th><th>Dung lượng</th><th>Lúc</th><th></th></tr></thead>
        <tbody>${lo}</tbody></table></div>`:''}`;

      sel.disabled = !CLEAN_SEL.size || d.capcut_running;
      sel.textContent = CLEAN_SEL.size ? `Dọn ${CLEAN_SEL.size} mục đã tích` : 'Dọn mục đã tích';
      sel.title = CLEAN_SEL.size ? '' : 'Chưa tích gói nào';

/* "24/07 17:50" — toLocaleString('vi') trả "17:50 24-07", đọc lướt hay nhầm giờ với ngày */
const vnTime = ms => {
  const d = new Date(ms), p = n => String(n).padStart(2,'0');
  const y = d.getFullYear() !== new Date().getFullYear() ? '/'+d.getFullYear() : '';
  return `${p(d.getDate())}/${p(d.getMonth()+1)}${y} ${p(d.getHours())}:${p(d.getMinutes())}`;
};

/* ---------- Lưới chủ đề + phân trang ----------
   16 chủ đề đổ ra một bảng dài thì phải cuộn mãi mới thấy hết, mà mỗi dòng lại là
   một quyết định "có làm cái này không". Thẻ cho thấy đủ thông tin để quyết ngay;
   phân trang giữ trang ngắn để so sánh được các chủ đề cạnh nhau. */
let TOPIC_TRANG = 0;
const TOPIC_MOI_TRANG = 9;

function veChuDe(){
  const grid = $('#topicGrid'); if(!grid || !PROJ) return;
  const ds = PROJ.topics || [];
  const soTrang = Math.max(1, Math.ceil(ds.length / TOPIC_MOI_TRANG));
  TOPIC_TRANG = Math.min(Math.max(0, TOPIC_TRANG), soTrang - 1);
  const dau = TOPIC_TRANG * TOPIC_MOI_TRANG;
  const trang = ds.slice(dau, dau + TOPIC_MOI_TRANG);
  const w = PROJ.work_dir;

  const n = $('#topicN');
  if(n) n.textContent = `${ds.length} chủ đề · hiện ${dau+1}-${dau+trang.length}`;

  grid.innerHTML = trang.map(t=>{
    const dsD = t.drafts || [];
    return `<div class="pcard tcard">
      <div class="row" style="justify-content:space-between;align-items:flex-start;margin:0">
        <span class="tag">#${t.i}</span>
        <span class="tag ${t.score>=7?'ok':(t.score>=6?'info':'')}" title="điểm tổng theo tiêu chí trong profile">${t.score??'—'}</span>
      </div>
      <b style="margin-top:8px">${esc(t.title)}</b>
      <div class="l">${t.dur}s${t.n_doan>1?` · <b>${t.n_doan} đoạn ghép</b>`:''}${t.tu!=null?` · từ ${Math.floor(t.tu/60)}:${String(Math.floor(t.tu%60)).padStart(2,'0')}`:''}</div>
      <div class="l" style="margin-top:6px">${dsD.length
        ? dsD.map(x=>`<span class="tag ${x.locked?'bad':'ok'}" title="${esc(x.name)} · ${x.locked?'đang mở trong CapCut · ':''}sửa lần cuối ${vnTime(x.mtime*1000)}">${esc(x.editor)}</span>`).join(' ')
        : '<span class="muted">chưa dựng draft</span>'}</div>
      <div class="acts">
        <button class="btn ghost sm" data-act="preview" data-proj="${esc(w)}" data-i="${t.i}">Xem trước</button>
        <button class="btn ghost sm" data-act="gen" data-proj="${esc(w)}" data-i="${t.i}">Tạo draft</button>
      </div>
    </div>`;
  }).join('');

  const pg = $('#topicPager');
  if(pg) pg.innerHTML = soTrang <= 1 ? '' : `
    <button class="btn ghost sm" data-act="topic-trang" data-t="${TOPIC_TRANG-1}" ${TOPIC_TRANG?'':'disabled'}>← Trước</button>
    ${Array.from({length: soTrang}, (_,i)=>
      `<button class="btn ${i===TOPIC_TRANG?'':'ghost'} sm" data-act="topic-trang" data-t="${i}">${i+1}</button>`).join('')}
    <button class="btn ghost sm" data-act="topic-trang" data-t="${TOPIC_TRANG+1}" ${TOPIC_TRANG<soTrang-1?'':'disabled'}>Sau →</button>`;
}
ACTIONS['topic-trang'] = d => { TOPIC_TRANG = +d.t; veChuDe(); };

/* ---------- Xem lời thoại ----------
   Hai việc trong một màn: (1) đọc lại buổi ghi hình mà không phải mở video, (2) SOI
   xem AI đã sửa những gì. Sửa im lặng thì không ai biết nó có sửa bậy không — mà ASR
   tiếng Việt sai đủ nhiều để chuyện đó đáng lo thật. */
let TS = null, TS_SACH = true;
const mmss = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
/* Xuất đúng bản đang xem trên màn (theo TS_SACH), không phải luôn luôn bản sạch —
   người soát lỗi ASR cần tải đúng thứ họ đang nhìn để đối chiếu ra ngoài app. */
const vanBanTS = () => TS.dong.map(d =>
  `[${mmss(d.start)}] ${TS_SACH ? d.text : (d.goc != null ? d.goc : d.text)}`).join('\n');
const tenFileTS = () => {
  const goc = (TS.record || 'loi-thoai').split(/[\\/]/).pop().replace(/\.[^.]+$/, '');
  return `${goc}_loi-thoai-${TS_SACH ? 'sach' : 'goc'}.txt`;
};
ACTIONS['xem-transcript'] = async () => {
  $('#mdTitle').textContent = 'Lời thoại';
  $('#mdBody').innerHTML = '<p class="muted small">Đang tải…</p>';
  $('#mdActs').innerHTML = '';
  const dong = document.createElement('button');
  dong.className = 'btn ghost'; dong.textContent = 'Đóng';
  dong.onclick = () => { MODAL_CLOSE = null; closeModal(); };
  $('#mdActs').appendChild(dong);
  MODAL_CLOSE = () => {};
  openVeil();
  document.querySelector('#veil .modal').classList.add('wide', 'bang');
  try{
    TS = await api(`/api/app-projects/${PROJ_ID}/transcript`);
  }catch(e){ $('#mdBody').innerHTML = `<p class="neg">${esc(String(e))}</p>`; return; }
  const saoChep = document.createElement('button');
  saoChep.className = 'btn ghost'; saoChep.textContent = 'Sao chép';
  saoChep.onclick = async () => {
    try{ await navigator.clipboard.writeText(vanBanTS()); toast('Đã sao chép lời thoại'); }
    catch(e){ toast('Không sao chép được — trình duyệt chặn clipboard', true); }
  };
  const taiVe = document.createElement('button');
  taiVe.className = 'btn ghost'; taiVe.textContent = 'Tải .txt';
  taiVe.onclick = () => {
    const url = URL.createObjectURL(new Blob([vanBanTS()], {type: 'text/plain;charset=utf-8'}));
    const a = document.createElement('a');
    a.href = url; a.download = tenFileTS();
    document.body.appendChild(a); a.click(); a.remove();
    URL.revokeObjectURL(url);
  };
  $('#mdActs').insertBefore(taiVe, dong);
  $('#mdActs').insertBefore(saoChep, taiVe);
  $('#mdBody').innerHTML = `
    <div class="row" style="margin-bottom:10px">
      <input id="tsQ" placeholder="tìm trong lời thoại…" style="flex:1;min-width:200px">
      <label class="lop" style="cursor:pointer"><input type="checkbox" id="tsSach" ${TS_SACH?'checked':''}>
        <span>bản đã làm sạch</span></label>
    </div>
    <p class="muted small" id="tsInfo"></p>
    <div id="tsList" class="tslist"></div>`;
  const ve = () => {
    const q = ($('#tsQ').value||'').trim().toLowerCase();
    const ds = TS.dong.filter(d => !q
      || (d.text||'').toLowerCase().includes(q) || (d.goc||'').toLowerCase().includes(q));
    $('#tsInfo').innerHTML = `${ds.length}/${TS.n} dòng · ${TS.n_sach} dòng đã qua AI`
      + (TS.n_doi ? ` · <b>${TS.n_doi} dòng bị sửa chữ</b>` : '')
      + (TS.n_bo ? ` · <span class="tag">${TS.n_bo} dòng bỏ khỏi phần tìm chủ đề</span>` : '')
      + (TS.n_sach < TS.n
          ? ` · <span class="neg">${TS.n - TS.n_sach} dòng còn chữ thô</span>`
            + ` <button class="btn ghost sm" data-act="lam-sach-ts">Làm sạch nốt</button>`
          : '');
    $('#tsList').innerHTML = ds.length ? ds.map(d=>{
      const doi = d.goc != null && d.goc.trim() !== (d.text||'').trim();
      const hien = TS_SACH ? d.text : (d.goc != null ? d.goc : d.text);
      return `<div class="tsrow${doi?' doi':''}${d.bo?' bo':''}"${d.bo?' title="AI cho là dòng không có nội dung — đã bỏ khỏi phần đi tìm chủ đề, nhưng vẫn giữ mốc thời gian"':''}>
        <span class="mono t">${mmss(d.start)}</span>
        <span class="w">${esc(hien)}
          ${doi && TS_SACH ? `<span class="goc" title="chữ Whisper nghe được trước khi AI sửa">${esc(d.goc)}</span>` : ''}</span>
      </div>`;
    }).join('') : '<p class="muted small">Không có dòng nào khớp.</p>';
  };
  $('#tsQ').oninput = ve;
  $('#tsSach').onchange = e => { TS_SACH = e.target.checked; ve(); };
  ve();
};

ACTIONS['lam-sach-ts'] = async (d, el) => busy(el, 'Đang gửi…', async () => {

    toast('Đang làm sạch lời thoại…'); startPolling();

/* Hộp thoại chọn của Windows. Gõ tay đường dẫn là bắt làm việc không công, mà sai
   một ký tự thì chỉ báo "không thấy thư mục" chứ không chỉ sai chỗ nào. */
async function pick(btn, kieu){
  await busy(btn, 'Đang mở…', async () => {
    try{
      const r = await api(`/api/pick?kieu=${kieu}`, {method:'POST'});
      if(r.huy) return;                       // người dùng bấm Cancel — im lặng là đúng
      if(kieu === 'thu_muc'){
        $('#dirIn').value = r.path; PREF.set('dir', r.path);
        browse(null, true);
      }else{
        /* Chọn thẳng một file: nạp nó vào danh sách rồi chọn sẵn, để bước sau vẫn
           là "Dùng file này" giống hệt đường quét — một luồng, không hai kiểu. */
        const sel = $('#fileSel');
        const ten = r.path.split('/').pop();
        sel.insertAdjacentHTML('afterbegin', `<option value="${esc(r.path)}" selected>${esc(ten)} · chọn tay</option>`);
        sel.value = r.path;
        toast('Đã chọn file — bấm "Dùng file này"');
      }
    }catch(e){ toast(String(e), true); }
  });
}

async function ganRecord(btn){
  const sel = $('#fileSel'), path = sel && sel.value;
  if(!path || path.startsWith('—') || path.startsWith('đang')) return toast('Chưa chọn file record', true);
  await busy(btn, 'Đang gắn…', async () => {
    try{
      const p = await api(`/api/app-projects/${PROJ_ID}/record?path=${encodeURIComponent(path)}`, {method:'POST'});
      // Tên mặc định là ngày giờ — đổi sang tên file cho dễ nhận ra trong danh sách.
      if(/^Dự án \d/.test(p.ten))
        await api(`/api/app-projects/${PROJ_ID}`, {method:'PATCH',

         nhau. Cản thì người dùng phải nhân bản file chỉ để đổi tên, tốn đĩa vô ích. */
      if(p.dung_chung) await modal({title:'Record này đang dùng ở dự án khác', body:p.dung_chung,

}

/* Quét thư mục = chạy ffprobe từng file, vài giây. Tab Dự án vẽ lại mỗi lần job
   xong, nên nhớ kết quả lần trước; bấm "Quét" mới quét thật lại. */
let SCAN = {key:null, dir:null, html:null};
async function browse(btn, force){
  const sel = $('#fileSel'); if(!sel) return;
  const want = $('#dirIn').value.trim();
  if(!force && SCAN.html && (SCAN.key === want || SCAN.dir === want)){ sel.innerHTML = SCAN.html; return; }
  sel.innerHTML = '<option>đang quét…</option>';
  await busy(btn, 'Đang quét…', async () => {
    try{
      const d = await api('/api/browse?dir='+encodeURIComponent(want));
      $('#dirIn').value = d.dir; PREF.set('dir', d.dir);   // bỏ trống -> server tự chọn mặc định
      const html = d.files.length
        ? d.files.map(f=>`<option value="${esc(f.path)}">${esc(f.duong||f.name)} · ${f.dur_min} phút`
            + `${f.video?'':' · 🎧 chỉ tiếng'} · xử lý ~${f.eta_min} phút`
            + `${f.eta_do_that?'':' (ước lượng)'}</option>`).join('')
        : '<option>— không có file record —</option>';
      SCAN = {key: want, dir: d.dir, html};
      sel.innerHTML = html;
      /* Cắt bớt trong im lặng là app nói dối: nhìn 300 dòng mà tưởng thư mục chỉ có
         ngần đó (docs/UI.md mục 6). */
      const note = $('#scanNote');
      if(note) note.innerHTML = d.files.length
        ? `Thấy <b>${d.files.length}</b> file${d.de_quy?' (gồm cả thư mục con, sâu tối đa 4 tầng)':''}.`
          + (d.cat_bot?` <span class="neg">Đã dừng ở ${d.max_file} file — thư mục quá lớn, hãy trỏ sát hơn hoặc bấm "Chọn file…".</span>`:'')
        : 'Không thấy file video/audio nào trong thư mục này.';
    }catch(e){ SCAN = {key:null, dir:null, html:null}; sel.innerHTML = `<option>${esc(e)}</option>`; }
  });
}
async function ingest(btn){
  /* #fileSel CHỈ tồn tại lúc CHƯA gắn record (khối "File record" còn là dropdown chọn).
     Gắn xong thì khối đó đổi sang thẻ tĩnh hiện record_path — không còn #fileSel nữa,
     mà nút Phân tích lúc đó mới BẬT (cần p.work_dir). Đọc thẳng sel.value trong mọi
     trường hợp là gọi .value trên null đúng lúc nút thật sự bấm được — ném TypeError
     NGAY DÒNG ĐẦU, im lặng hoàn toàn: không toast, không job, "bấm không có gì xảy ra".
     Bắt bởi người dùng thật, không phải đoán. */
  const sel = $('#fileSel');
  const path = sel ? sel.value : (PROJ && PROJ.record_path) || '';
  if(!path || path.startsWith('—') || path.startsWith('đang')) return toast('Chưa chọn file record', true);
  const label = sel ? sel.options[sel.selectedIndex].text : path.split(/[\\/]/).pop();
  if(!await confirmBox('Phân tích record?', label + '\n\nChạy nền — theo dõi ở mục Tiến trình.')) return;
  await busy(btn, 'Đang gửi…', async () => {
    try{
      /* Truyền work_dir của DỰ ÁN: hai dự án dùng chung một record vẫn phải phân tích
         riêng, suy từ tên file là ghi đè lên nhau. */
      const w = (PROJ && PROJ.work_dir) ? `&work=${encodeURIComponent(PROJ.work_dir)}` : '';
      const r = await api(`/api/ingest?path=${encodeURIComponent(path)}&asr=${$('#asrSel').value}${w}`,{method:'POST'});
      askNotify();
      // Bóc lời record dài có thể chạy tới hàng chục phút — mở NGAY màn tiến trình
      // giữa trang thay vì chỉ toast rồi im, để người dùng thấy máy đang làm việc
      // thật, không tưởng app không phản hồi (đúng lỗi người dùng thật báo).
      moTienTrinhModal(r.job, `Đang phân tích · ${label}`);
    }catch(e){ toast(String(e), true); }
  });
}
/* Dựng draft GHI ĐÈ tại chỗ (build_short_draft.py). Bấm lại chủ đề đã dựng là
   xoá sạch phần editor sửa tay trong CapCut -> phải hỏi, và phải chặn sớm khi
   draft đang mở, thay vì để build chạy 3 phút rồi mới báo .locked. */
async function gen(proj, topic, btn){
  const editor = $('#edSel').value;
  const name = `${proj}_t${topic}_${editor}`;
  /* PROJ là MỘT dự án (từ /api/app-projects/{id}), không phải {projects:[...]} như
     bản cũ. Đọc nhầm là ném TypeError ngay trong handler -> nút bấm không phản ứng
     gì cả, đúng kiểu hỏng khó lần nhất: không toast, không log, chỉ "bấm không được". */
  const t = (PROJ?.topics || []).find(x => x.i === topic);
  const old = (t?.drafts || []).find(x => x.name === name);
  if(old && old.locked)
    return modal({title:'Draft đang mở trong CapCut', body:
      `"${name}" đang mở (.locked) nên không ghi được.\nĐóng nó trong CapCut (về màn hình danh sách) rồi bấm lại.`,
      actions:[{label:'Đã hiểu', value:null}]});
  if(old && !await modal({title:'Dựng lại sẽ ghi đè draft cũ', body:
      `"${name}" đã dựng lúc ${vnTime(old.mtime*1000)}.\n`
      + 'Dựng lại sẽ GHI ĐÈ — mọi thứ editor đã sửa tay trong CapCut sẽ mất.',
      actions:[{label:'Ghi đè', value:true, style:'danger'}, {label:'Huỷ', value:false, style:'ghost'}]}))
    return;
  await busy(btn, 'Đang gửi…', async () => {
    try{
      const r = await api(`/api/project/${proj}/generate?topic=${topic}&editor=${editor}`,{method:'POST'});
      toast(`Đang dựng "${r.draft}" theo gu ${editor}`); askNotify(); startPolling();
    }catch(e){ toast(String(e), true); }
  });
}
ACTIONS.preview = (d, el) => preview(d.proj, +d.i, el);
ACTIONS.gen     = (d, el) => gen(d.proj, +d.i, el);
function startPolling(){ if(!JOB_TIMER) JOB_TIMER = setInterval(pollJobs, 1500); pollJobs(); }

/* Đọc TIẾN TRÌNH THẬT từ log. Pipeline vốn đã in "(1:19:06/3:55:06)" và tên từng
   giai đoạn — dữ liệu có sẵn, trước đây chỉ hiện 4 dòng chữ nên không ai đọc ra. */
const hms = s => s.split(':').reduce((a,b)=>a*60+ +b, 0);
const PHASES = [['[asr-fine]','bóc kỹ đoạn'],['[nhịp]','cắt khoảng lặng'],['[enrich]','AI chọn hook & SFX'],
  ['[base]','dựng nền video'],['[kết]','đuôi kết'],['[caption-fix]','sửa caption'],
  ['[broll]','tải B-roll'],['[P4]','áp gu editor'],['[sfx]','chèn SFX']];
/* "còn ~12 phút" trả lời đúng câu người dùng đang hỏi; "43%" thì không. */
const etaTxt = s => (s == null || !isFinite(s) || s <= 0) ? ''
  : s < 45 ? ' · sắp xong'
  : s < 5400 ? ` · còn ~${Math.round(s/60)} phút`
  : ` · còn ~${(s/3600).toFixed(1)} tiếng`;
function jobProgress(j){
  const log = j.log||[];
  if(j.state==='done')  return {pct:100, label:'hoàn tất'};
  if(j.state==='error') return {pct:100, label:'lỗi'};
  /* Bước Gemini của luồng phân tích record KHÔNG in mốc thời gian nào. Không bắt
     riêng thì thanh đứng mãi ở "bóc lời 3:55:06 / 3:55:06" — nhìn y như treo. */
  if(log.some(l => l.includes('[3/3]'))) return {pct:94, label:'Gemini trích chủ đề'};
  if(log.some(l => l.includes('[2/3]'))) return {pct:88, label:'làm sạch transcript'};
  const elapsed = Math.max(1, Date.now()/1000 - (j.ts || 0));
  for(let i=log.length-1;i>=0;i--){                        // ưu tiên mốc thời gian thật
    const m = log[i].match(/\((\d+(?::\d{2}){1,2})\/(\d+(?::\d{2}){1,2})\)/);
    if(m){
      const a=hms(m[1]), b=hms(m[2]);
      if(b>0) return {pct:Math.min(98, a/b*100), label:`bóc lời ${m[1]} / ${m[2]}`,
                      eta: a>0 ? elapsed*(b-a)/a : null};   // suy từ tốc độ THẬT của máy này
    }
  }
  let step=-1, name='';                                    // không có thì suy từ giai đoạn
  log.forEach(l => PHASES.forEach(([k,n],i)=>{ if(l.includes(k) && i>step){ step=i; name=n; } }));
  if(step>=0) return {pct:(step+1)/PHASES.length*100, label:name};
  return {pct:6, label:'đang khởi động'};
}
function notifyDone(j){
  const msg = j.state==='error' ? `Lỗi: ${j.title}` : `Xong: ${j.title}`;
  toast(msg, j.state==='error');
  try{
    if(window.Notification && Notification.permission==='granted') new Notification('CapCut Auto Editor', {body:msg});
  }catch(e){}
  document.title = (j.state==='error'?'⚠ ':'✅ ') + 'CapCut Auto Editor';
  setTimeout(()=>document.title='CapCut Auto Editor', 8000);
}
/* ---------- Màn tiến trình nổi bật giữa trang ----------
   Trước đây job chỉ hiện trong một khối nhỏ cuối trang (dễ lọt khỏi màn hình) cộng
   chấm tròn góc trên — với việc chạy tới hàng chục phút (bóc lời record dài), người
   dùng không thấy gì NGAY GIỮA MÀN HÌNH nên tưởng app không phản hồi. Mở modal này
   ngay lúc bấm Phân tích/Tạo draft; bấm "Chạy nền" đóng lại bất cứ lúc nào — job vẫn
   chạy tiếp, không phải màn hình khoá luồng. */
let PM_JOB = null;   // id job modal đang theo dõi — null nghĩa là modal này đang đóng
function moTienTrinhModal(jobId, tieuDe){
  PM_JOB = jobId;
  $('#mdTitle').textContent = tieuDe;
  $('#mdBody').innerHTML = '<div id="pmBody" style="text-align:left"><p class="muted small">Đang khởi động…</p></div>';
  const chayNen = document.createElement('button');
  chayNen.className = 'btn ghost'; chayNen.textContent = 'Chạy nền';
  chayNen.title = 'Đóng màn này — job vẫn chạy tiếp, xem lại ở mục Tiến trình';
  chayNen.onclick = () => { PM_JOB = null; MODAL_CLOSE = null; closeModal(); };
  $('#mdActs').innerHTML = ''; $('#mdActs').appendChild(chayNen);
  MODAL_CLOSE = () => { PM_JOB = null; };
  openVeil();
  document.querySelector('#veil .modal').classList.add('wide');
  startPolling();       // vẽ ngay lần đầu qua tick poll tới, không đợi 1.5s trống trơn
}
function veTienTrinhModal(j){
  const body = $('#pmBody'); if(!body) return;
  if(!j){ body.innerHTML = '<p class="muted small">Đang khởi động…</p>'; return; }
  const p = jobProgress(j);
  const log = j.log || [];
  body.innerHTML = `
    <div class="prog${j.state==='running'?'':(j.state==='error'?' err':' idle')}" style="height:14px">
      <i style="width:${p.pct}%"></i></div>
    <p style="margin:10px 0 4px"><b>${esc(p.label)}</b>${esc(j.state==='running'?etaTxt(p.eta):'')}</p>
    ${log.length?`<pre style="max-height:280px;overflow:auto">${log.slice(-14).map(esc).join('\n')}</pre>`:''}`;
  if(j.state !== 'running'){
    // Job xong/lỗi trong lúc modal đang mở — đổi nút "Chạy nền" thành nút đóng bình
    // thường, đừng tự đóng modal đột ngột (người dùng có thể đang đọc log lỗi).
    const acts = $('#mdActs');
    if(acts && acts.children.length === 1 && acts.firstElementChild.textContent === 'Chạy nền'){
      acts.innerHTML = '';
      const dong = document.createElement('button');
      dong.className = 'btn'; dong.textContent = j.state==='error' ? 'Đã hiểu' : 'Xong, đóng lại';
      dong.onclick = () => { PM_JOB = null; MODAL_CLOSE = null; closeModal(); };
      acts.appendChild(dong);
    }
  }
}
const SEEN_DONE = new Set();
const JOB_DONE_CB = {};      // việc nào cần làm tiếp khi job XONG THẬT (thay vì đoán bằng setTimeout)
async function pollJobs(){
  const d = await api('/api/jobs').catch(()=>({jobs:[]}));
  const running = d.jobs.filter(j=>j.state==='running');

  if(PM_JOB) veTienTrinhModal(d.jobs.find(x => x.id === PM_JOB));

  /* badge toàn cục — thấy được ở MỌI tab, kể cả chế độ Agent */
  const bg = $('#jobBadge');
  if(running.length){
    const p = jobProgress(running[0]);
    bg.hidden = false;
    bg.innerHTML = `<span class="spin"></span><span class="txt">${esc(running[0].title)} · ${Math.round(p.pct)}%`
                 + `${esc(etaTxt(p.eta))}${running.length>1?` (+${running.length-1})`:''}</span>`;
    bg.title = 'Bấm để xem tiến trình';
    bg.onclick = ()=>{ if($('#agent').hidden===false) setMode(false);
                       showTab('proj');
                       setTimeout(()=>{
    // cuộn tới khu tiến trình ĐANG HIỆN, không phải cái đầu tiên trong DOM
    const t = [...document.querySelectorAll('.jobsBox')].find(b => b.offsetParent !== null);
    t?.scrollIntoView({behavior:'smooth'});
  }, 300); };
  } else bg.hidden = true;

  d.jobs.filter(j=>j.state!=='running' && !SEEN_DONE.has(j.id)).forEach(j=>{
    SEEN_DONE.add(j.id); notifyDone(j);
    const cb = JOB_DONE_CB[j.id];
    if(cb){ delete JOB_DONE_CB[j.id]; try{ cb(j); }catch(e){} }
    /* Xong việc thì màn hình phải TỰ đúng: dựng xong mà màn hình làm việc vẫn ghi
       "chưa dựng", Tổng quan vẫn thiếu draft mới, là người dùng phải tự F5 mới tin. */
    if(j.result && (j.result.project || j.result.draft)){
      if(!$('#work').hidden) guard('#work', loadWork);
      if(!$('#over').hidden) guard('#over', loadOver);
      if(!$('#home').hidden) guard('#home', loadHome);
    }
  });
  if(!running.length && JOB_TIMER){ clearInterval(JOB_TIMER); JOB_TIMER=null; }

  /* Khu tiến trình xuất hiện ở NHIỀU trang (Home và màn hình làm việc). Trước đây
     cả hai cùng id="jobs" nên $('#jobs') luôn trúng cái ĐẦU trong DOM — nằm ở
     section đang ẩn — và tiến trình vẽ vào chỗ không ai nhìn thấy. Dùng class rồi
     vẽ vào MỌI chỗ, đúng chỗ nào đang hiện thì người dùng thấy chỗ đó. */
  const hop = [...document.querySelectorAll('.jobsBox')]; if(!hop.length) return;
  if(!d.jobs.length){
    hop.forEach(b => b.innerHTML = '<p class="muted small">Chưa có việc nào chạy.</p>');
    return;
  }
  const html = d.jobs.slice(0,6).map(j=>{
    const p = jobProgress(j);
    const st = j.state==='running' ? '<span class="tag info">đang chạy</span>'
             : j.state==='done'    ? '<span class="tag ok">xong</span>'
             : '<span class="tag bad">lỗi</span>';
    const draft = j.result && j.result.draft;
    const log = (j.log||[]);
    return `<div class="card" style="margin-bottom:10px">
      <div class="row" style="margin:0"><b class="small">${esc(j.title)}</b> ${st}
        ${draft?`<span class="tag ok">${esc(draft)}</span>`:''}
        <span style="margin-left:auto;display:flex;gap:8px">
        ${draft && j.state==='done'?`<button class="btn ghost sm" data-act="open" data-name="${esc(draft)}">Mở thư mục</button>`:''}
        ${log.length>3?`<button class="btn ghost sm" data-act="log" data-id="${esc(j.id)}">Log đầy đủ</button>`:''}
        </span></div>
      <div class="prog${j.state==='running'?'':(j.state==='error'?' err':' idle')}"><i style="width:${p.pct}%"></i></div>
      <div class="muted small">${esc(p.label)}${esc(j.state==='running'?etaTxt(p.eta):'')}</div>
      ${log.length?`<pre>${log.slice(-3).map(esc).join('\n')}</pre>`:''}</div>`;
  }).join('');
  /* Chỉ vẽ lại khi ĐỔI: vẽ lại mỗi 1.5s làm mất vệt bôi đen khi người dùng đang
     copy dòng log lỗi ra để hỏi. NHƯNG so với MỘT biến cache DÙNG CHUNG cho mọi
     trang là sai — chuyển tab thì loadHome()/loadWork() dựng lại <div
     class="jobsBox"></div> RỖNG TINH; nếu đúng lúc đó tiến trình job CHƯA đổi so
     với lần poll trước (html === JOBS_HTML cũ), nhánh này bị bỏ qua và ô rỗng vừa
     dựng không bao giờ được lấp — đứng im/trống trơn cho tới khi tiến trình job
     đổi thật. Đúng lỗi người dùng báo: "không cập nhật, phải thoát ra vào lại,
     đôi khi còn bị ẩn đi". Vá: so sánh theo ĐÚNG TỪNG PHẦN TỬ đang có gì, không
     theo một cache chung — ô nào đã đúng nội dung thì bỏ qua (giữ vệt bôi đen),
     ô nào vừa bị dựng rỗng thì luôn được lấp ngay, không đợi tiến trình đổi. */
  hop.forEach(b => { if(b.innerHTML !== html) b.innerHTML = html; });
}

/* XEM TRƯỚC CHỦ ĐỀ — trước đây chỉ có tiêu đề + điểm, muốn biết nội dung thật
   phải dựng draft rồi mở CapCut nghe. Với 16 chủ đề thì đó là chọn mù. */
async function preview(proj, idx){
  $('#mdTitle').textContent = 'Đang tải…'; $('#mdBody').innerHTML=''; $('#mdActs').innerHTML='';
  document.querySelector('.modal').classList.add('wide');
  MODAL_CLOSE = ()=>{};      // Esc / bấm ra ngoài đóng được
  openVeil();
  try{
    const d = await api(`/api/project/${proj}/topic/${idx}/preview`);
    const mm = s => `${Math.floor(s/60)}:${String(Math.floor(s%60)).padStart(2,'0')}`;
    $('#mdTitle').textContent = d.title || `Chủ đề ${idx}`;
    $('#mdBody').innerHTML = `<div class="pv">
      <div class="row" style="margin:0">
        <span class="tag ok">điểm ${d.total ?? '—'}</span>
        ${(d.scores||[]).map(s=>`<span class="tag">${esc(s.name)} ${s.score}</span>`).join('')}
        ${(d.ranges||[]).map(r=>`<span class="tag info">${mm(r[0])}–${mm(r[1])}</span>`).join('')}
      </div>
      ${d.summary?`<div><b>Tóm tắt.</b> ${esc(d.summary)}</div>`:''}
      ${d.hook?`<div><b>Góc hook.</b> ${esc(d.hook)}</div>`:''}
      <div><b>Nghe thử 40 giây đầu</b>

}
ACTIONS.snap = (d, el) => snapDraft(d.name, el);

async function showDiff(n, btn){
  const out = $('#diffOut'); out.innerHTML = '<h2>Đang so sánh…</h2>';
  await busy(btn, 'Đang so…', async () => {
  try{
    const d = await api(`/api/draft/${encodeURIComponent(n)}/diff`);
    const rows = (arr,cls) => arr.length ? arr.map(r=>`<tr><td><span class="tag ${cls}">${esc(r.kind)}</span></td>
        <td>${esc(r.name)||'—'}</td><td class="mono muted">${esc(r.resource_id||'')}</td></tr>`).join('')
      : '<tr><td colspan="3" class="muted">— không có —</td></tr>';
    const changed = d.added.length + d.removed.length;
    const s = d.sua || {};
    /* "Độ phải sửa" là thước đo tiến hoá: editor phải sửa bao nhiêu thì draft mới
       dùng được. Giảm dần theo tháng = app đang hợp gu hơn, thay cho cảm tính. */
    const doSua = s.diem != null ? `
      <div class="cards">
        <div class="card"><div class="n ${s.diem<=0.15?'good':(s.diem>=0.4?'bad':'')}">${Math.round(s.diem*100)}%</div>

        <div class="card"><div class="n">${s.caption.sua_hoac_them}<span class="muted" style="font-size:16px">/${s.caption.tong}</span></div>
          <div class="l">caption bị sửa chữ · ${s.caption.doi_gio} bị đổi giờ · ${s.caption.bo} bị bỏ</div></div>
        <div class="card"><div class="n">${s.nhip_cat.bi_doi}<span class="muted" style="font-size:16px">/${s.nhip_cat.tong}</span></div>
          <div class="l">đoạn hình bị cắt lại</div></div>
        <div class="card"><div class="n">${s.am_luong.bi_chinh}<span class="muted" style="font-size:16px">/${s.am_luong.tong}</span></div>
          <div class="l">nguồn tiếng bị chỉnh âm lượng</div></div>
      </div>` : (s.chua_do_duoc ? `<p class="muted small">${esc(s.chua_do_duoc)}</p>` : '');
    out.innerHTML = `<h2>${esc(n)} — editor đã thay đổi</h2>
      ${doSua}
      <div class="cards">
        <div class="card"><div class="n good">${d.added.length}</div><div class="l">thêm mới → vào kho</div></div>
        <div class="card"><div class="n bad">${d.removed.length}</div><div class="l">bị gỡ → hạ ưu tiên</div></div>
        <div class="card"><div class="n">${d.kept.length}</div><div class="l">giữ nguyên</div></div>
      </div>
      ${changed ? `<div class="wrap"><table><thead><tr><th>Loại</th><th>Tên</th><th>resource_id</th></tr></thead>
          <tbody>${rows(d.added,'ok')}${rows(d.removed,'bad')}</tbody></table></div>
        <div class="row" style="margin-top:12px">
          <button class="btn" data-act="sync" data-name="${esc(n)}">Đồng bộ về kho</button>
          <span class="muted small">Nạp phần vừa thêm vào kho của editor — lần sau app tự dùng đúng gu đó.</span>
        </div>`
        : emptyBox('Editor chưa sửa gì so với mốc',
                   'Mở draft trong CapCut, sửa theo gu rồi Ctrl+S và ĐÓNG draft, sau đó so lại.')}`;
    out.scrollIntoView({behavior:'smooth', block:'nearest'});   // kết quả nằm dưới bảng dài
  }catch(e){ out.innerHTML = `<p class="neg">${esc(e)}</p>`; }
  });
}
async function syncDraft(n, btn){
