/* ══════════════════ TAB: ÂM THANH ══════════════════ */
let CUR_DRAFT=null, LOCKED=new Set();
/* Cân bằng âm thanh KHÔNG còn là một khu vực riêng trên thanh bên: nó luôn thao tác
   trên draft của MỘT dự án, nên đứng riêng thì người dùng phải tự nhớ draft nào thuộc
   dự án nào. Giờ nhúng vào màn hình làm việc, và chỉ liệt kê draft của chính dự án đó. */
async function loadAudioInto(sel, proj){
  const box = $(sel); if(!box) return;
  box.innerHTML = skeleton(1);
  const d = await api('/api/drafts');
  let ds = d.drafts;
  if(proj && proj.work_dir) ds = ds.filter(x => x.name.startsWith(proj.work_dir + '_t'));
  if(!ds.length){
    box.innerHTML = emptyBox('Chưa có draft nào để đo',
      'Dựng ít nhất một draft ở bước 4, rồi quay lại đây để cân bằng âm lượng.');
    return;
  }
  LOCKED = new Set(d.drafts.filter(x=>x.locked).map(x=>x.name));
  const want = CUR_DRAFT || PREF.get('audioDraft', '');
  const cur = ds.some(x=>x.name===want) ? want : ds[0].name;
  CUR_DRAFT = cur;
  const dd = {drafts: ds};
  box.innerHTML = `
    <div class="row">
      <label class="fld"><span>Draft</span>
        <select id="selD" style="min-width:260px">${dd.drafts.map(x=>
          `<option ${x.name===cur?'selected':''}>${esc(x.name)}</option>`).join('')}</select></label>
      <label class="fld"><span>&nbsp;</span><button class="btn ghost" id="btnMeasure">Đo lại</button></label>
      <label class="fld"><span>&nbsp;</span><button class="btn" id="btnApply">Cân bằng &amp; ghi vào draft</button></label>
    </div>
    <p class="muted small">Chuẩn EBU R128 · giọng nói −14 LUFS · SFX −16 · nhạc nền −30 · trần true peak −1 dBTP</p>
    <div id="aOut"></div>`;
  $('#btnMeasure').onclick = e => measure(e.currentTarget);
  $('#selD').onchange = () => { PREF.set('audioDraft', $('#selD').value); lockUi(); measure(); };
  $('#btnApply').onclick = async e => {
    const n = $('#selD').value, btn = e.currentTarget;
    if(!await confirmBox('Ghi âm lượng vào draft?', `Draft "${n}" sẽ được sửa (có backup .prebalance.bak).\nĐóng draft trong CapCut trước khi ghi.`)) return;
    await busy(btn, 'Đang gửi…', async () => {
      try{
        const r = await api(`/api/draft/${encodeURIComponent(n)}/balance?dry=false`,{method:'POST'});
        toast('Đang ghi âm lượng…');
        JOB_DONE_CB[r.job] = () => { if(!$('#work').hidden) measure(); };   // đo lại khi ghi XONG thật
        startPolling();
      }catch(e){ toast(String(e), true); }
    });
  };
  lockUi(); measure();
}
/* Draft đang mở trong CapCut thì ghi vào là hỏng — chặn ngay ở nút, kèm lý do,
   thay vì để job chạy rồi trả về lỗi .locked. */
function lockUi(){
  const n = $('#selD')?.value, b = $('#btnApply');
  if(!b) return;
  const bad = LOCKED.has(n);
  b.disabled = bad;
  b.title = bad ? 'Draft đang mở trong CapCut — đóng nó (về màn hình danh sách) rồi ghi' : '';
}
async function measure(btn){
  const n = $('#selD').value; CUR_DRAFT = n; PREF.set('audioDraft', n);
  $('#aOut').innerHTML = '<p class="muted small">Đang đo LUFS từng nguồn tiếng… (lần đầu hơi lâu, sau đó có cache)</p>';
  await busy(btn, 'Đang đo…', () => measureRun(n));
}
async function measureRun(n){
  try{
    const d = await api(`/api/draft/${encodeURIComponent(n)}/audio`);
    if(!d.rows.length){ $('#aOut').innerHTML = emptyBox('Draft này không có nguồn tiếng nào',
      'Draft chưa có voice/SFX/nhạc — không có gì để cân bằng.'); return; }
    const sfx = d.rows.filter(r=>r.role==='sfx').map(r=>r.lufs);
    const spread = sfx.length>1 ? (Math.max(...sfx)-Math.min(...sfx)).toFixed(1) : null;
    $('#aOut').innerHTML = `
      ${spread?`<div class="cards"><div class="card"><div class="n ${spread>6?'bad':'good'}">${spread} dB</div>
        <div class="l">chênh lệch giữa các SFX${spread>6?' — nên cân bằng':''}</div></div></div>`:''}
      <div class="wrap"><table>
        <thead><tr><th>Vai trò</th><th>Nguồn</th><th>Đo (LUFS)</th><th>Cần chỉnh</th><th>Volume</th></tr></thead>
        <tbody>${d.rows.map(r=>`<tr>
          <td><span class="tag ${r.role==='voice'?'ok':''}">${r.role}</span></td>
          <td>${esc(r.file)}</td><td class="mono">${r.lufs}</td>
          <td class="mono ${r.gain>0?'pos':(r.gain<0?'neg':'')}">${r.gain>0?'+':''}${r.gain} dB</td>
          <td class="mono">${r.done?`<b>${r.volume}</b> <span class="tag ok">đã cân bằng</span>`
                                    :`${r.cur} → <b>${r.volume}</b>`}</td></tr>`).join('')}</tbody></table></div>`;
  }catch(e){ $('#aOut').innerHTML = `<p class="neg">${esc(e)}</p>`; }
}

/* Chỉ xin ảnh cho loại THỰC SỰ có gói hình. Xin cho audio/font thì server trả 404,

const THUMBABLE = new Set(['sticker','text_template','effect','transition','image','video']);

             onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'thumb-none'}))">`;
  return `<div class="thumb-none" style="display:grid;place-items:center;color:var(--color-faded-gray);
           font-weight:700">${GLYPH[a.kind]||''}</div>`;
}
let LIB_LIMIT = 25;

      <tbody>${rows.map(a=>`<tr>
        <td>${thumbCell(a)}</td>
        <td><span class="tag">${esc(a.kind)}</span></td>
        <td>${esc(a.name)||'<span class="muted">—</span>'}</td>
        <td class="muted">${esc(a.owner||'')}</td>
        <td><div class="bar"><i style="width:${Math.min(100,a.use_count*3)}%"></i></div></td>
        <td class="mono"><b>${a.use_count}</b>${a.drop_count?` <span class="neg">−${a.drop_count}</span>`:''}</td>
      </tr>`).join('')}</tbody></table></div>
      <div class="row" style="margin-top:12px">
        <span class="muted small">Hiện ${rows.length}/${all.length} tài nguyên${
          all.length<LIB.assets.length?` (lọc từ ${LIB.assets.length})`:''}</span>
        ${all.length>rows.length?`<button class="btn ghost sm" data-act="libAll">Xem tất cả ${all.length}</button>`:''}
      </div>`
    /* cắt bớt mà KHÔNG nói là nói dối: nhìn 25 dòng tưởng kho chỉ có ngần đó */
    : emptyBox('Không có tài nguyên khớp bộ lọc', 'Xoá bớt chữ trong ô lọc hoặc chọn lại loại.');
}
ACTIONS.libAll = () => { LIB_LIMIT = 1e6; renderLib(); };

/* ══════════════════ AGENT ══════════════════ */
let SESSION = PREF.get('chat', 'default');
const SUGGEST = ['Tôi đang có những dự án nào?','Kho có gì của Nguyên?','Draft nào chưa chụp mốc?','Đo âm lượng draft mới nhất'];
function bubble(role, text, tools){
  const box = $('#chat');
  if(tools && tools.length){
    const t = document.createElement('div'); t.className='tools';
    t.innerHTML = tools.map(x=>`<span class="tag info">${esc(x)}</span>`).join('');
    box.appendChild(t);
  }
  const d = document.createElement('div');
  d.className = 'bub ' + (role==='user'?'u':'a');
  d.innerHTML = esc(text).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
  box.appendChild(d); box.scrollTop = box.scrollHeight;
  return d;
}
async function loadChat(){
  $('#chat').innerHTML = '';
  $('#chips').innerHTML = SUGGEST.map(s=>`<button class="chip" data-act="ask">${esc(s)}</button>`).join('');
  /* Thiếu key thì chat trả về lỗi tiếng Anh của SDK — nói trước bằng tiếng Việt
     và khoá ô nhập, hơn là để người dùng gõ xong mới ăn một cục lỗi khó hiểu. */
  const ed = await api('/api/editors').catch(()=>({keys:{gemini:true}}));
  const ok = !!ed.keys.gemini;
  $('#msg').disabled = !ok; $('#btnSend').disabled = !ok;
  $('#chips').hidden = !ok;
  if(!ok){
    $('#msg').placeholder = 'Chế độ Agent cần GEMINI_API_KEY';
    bubble('model','Chưa có GEMINI_API_KEY nên chế độ Agent chưa dùng được.\n'
      + 'Đóng app, mở lại bằng: set GEMINI_API_KEY=... & python app.py\n'
      + 'Trong lúc chờ, chế độ Thủ công vẫn chạy bình thường (trừ nút Phân tích).');
    return;
  }
  const d = await api('/api/agent/history?session='+SESSION).catch(()=>({messages:[]}));
  if(!d.messages.length){
    bubble('model','Chào bạn. Tôi làm được: phân tích record mới, dựng draft theo gu editor, xem kho tài nguyên, so sánh editor đã sửa gì, cân bằng âm thanh. Cần gì cứ nói.');
  }
  d.messages.forEach(m=>{
    /* Lịch sử giờ có cả dòng 'tool' (tool đã gọi + dữ liệu trả về) để lượt sau
       agent còn nhớ. Người dùng chỉ cần thấy ĐÃ CHẠY GÌ, không cần cả cục JSON. */
    if(m.role === 'tool'){
      let ten = 'tool';
      try{ ten = JSON.parse(m.content).tool || ten; }catch(e){}
      const t = document.createElement('div');
      t.className = 'tools';
      t.innerHTML = `<span class="tag info" title="${esc(m.content.slice(0,300))}">${esc(ten)}</span>`;
      $('#chat').appendChild(t);
      return;
    }
    bubble(m.role==='user'?'user':'model', m.content);
  });
}
/* Nhiều cuộc trò chuyện thay vì một phiên "default" duy nhất: agent nhớ ngữ cảnh,
   nên trộn việc dựng draft hôm nay với việc cân âm thanh tuần trước vào cùng một
   mạch là làm nhiễu chính trí nhớ của nó. Mỗi việc một cuộc. */
async function loadChatList(){
  const box = $('#chatList'); if(!box) return;
  const d = await api('/api/agent/sessions').catch(()=>({sessions:[]}));
  const list = d.sessions.length ? d.sessions : [{session: SESSION, title: '', n: 0}];
  if(!list.some(s => s.session === SESSION)) list.unshift({session: SESSION, title: '', n: 0});
  box.innerHTML = list.map(s=>`<button data-act="pickChat" data-s="${esc(s.session)}"
      class="${s.session===SESSION?'on':''}" title="${esc(s.title||'')}">
      <span class="t">${esc(s.title ? s.title.slice(0,42) : 'Trò chuyện mới')}</span>
      <span class="x" data-act="delChat" data-s="${esc(s.session)}" title="Xoá cuộc trò chuyện">×</span>
    </button>`).join('');
}
ACTIONS.pickChat = d => { SESSION = d.s; PREF.set('chat', SESSION); loadChat(); loadChatList(); };
ACTIONS.delChat = async d => {
  if(!await confirmBox('Xoá cuộc trò chuyện này?', 'Agent sẽ quên hết ngữ cảnh đã trao đổi trong đó.')) return;
  await api('/api/agent/reset?session=' + encodeURIComponent(d.s), {method:'POST'});
  if(d.s === SESSION){ SESSION = 'c' + Date.now(); PREF.set('chat', SESSION); }
  toast('Đã xoá cuộc trò chuyện'); loadChat(); loadChatList();
};
$('#btnNewChat').onclick = () => {
  SESSION = 'c' + Date.now(); PREF.set('chat', SESSION);
  loadChat(); loadChatList(); $('#msg').focus();
};
/* Việc phá huỷ: agent chỉ ĐỀ XUẤT, người dùng bấm nút mới chạy. Một câu tiếng Việt
   bị hiểu nhầm không được phép xoá công editor vừa ngồi sửa cả buổi. */
function confirmCard(x){
  const box = $('#chat');
  const d = document.createElement('div');
  d.className = 'bub a';
  d.style.borderColor = 'var(--color-danger)';
  d.innerHTML = `<b>Cần bạn xác nhận: ${esc(x.hanh_dong)}</b>
    <div class="mono small" style="margin:6px 0">${esc(JSON.stringify(x.tham_so))}</div>
    ${x.canh_bao?`<div class="neg small">${esc(x.canh_bao)}</div>`:''}
    <div class="row" style="margin:10px 0 0">
      <button class="btn danger sm" data-act="agentYes">Xác nhận chạy</button>
      <button class="btn ghost sm" data-act="agentNo">Bỏ qua</button>
    </div>`;
  d.querySelector('[data-act="agentYes"]').onclick = async e => {
    await busy(e.currentTarget, 'Đang chạy…', async () => {
      try{
        const r = await api('/api/agent/confirm', {method:'POST',
          headers:{'Content-Type':'application/json'},
          body: JSON.stringify({session: SESSION, hanh_dong: x.hanh_dong, tham_so: x.tham_so})});
        d.remove();
        bubble('model', r.ghi_chu + (r.ket_qua && r.ket_qua.draft ? ` → ${r.ket_qua.draft}` : ''));
        askNotify(); startPolling();
      }catch(e){ toast(String(e), true); }
    });
  };
  d.querySelector('[data-act="agentNo"]').onclick = () => { d.remove(); bubble('model','Đã bỏ qua.'); };
  box.appendChild(d); box.scrollTop = box.scrollHeight;
}
function ask(t){ $('#msg').value = t; send(); }
ACTIONS.ask = (d, el) => ask(el.textContent);
async function send(){
  const inp = $('#msg'), text = inp.value.trim();
  if(!text) return;
  inp.value=''; bubble('user', text);
  /* Agent gọi Gemini + tool, có lượt mất 20-30 giây. Ba chấm nhấp nháy không nói
     được là "đang chạy" hay "treo" -> đếm giây để người dùng còn biết mà chờ. */
  const typing = document.createElement('div');
  typing.className='bub a'; typing.innerHTML='<span class="dots"><span></span><span></span><span></span></span>';
  $('#chat').appendChild(typing); $('#chat').scrollTop = $('#chat').scrollHeight;
  const t0 = Date.now();
  const tick = setInterval(()=>{
    const s = Math.round((Date.now()-t0)/1000);
    if(s >= 3) typing.innerHTML = `<span class="dots"><span></span><span></span><span></span></span>
      <span class="muted small" style="margin-left:8px">đang xử lý… ${s}s</span>`;
  }, 1000);
  const btn = $('#btnSend'); btn.disabled = true;
  try{
    const r = await api(`/api/agent/chat?session=${SESSION}&message=${encodeURIComponent(text)}`,{method:'POST'});
    bubble('model', r.reply, (r.steps||[]).map(s=>s.tool));
    if(r.cho_xac_nhan) confirmCard(r.cho_xac_nhan);
    if((r.steps||[]).some(s=>s.ket_qua && s.ket_qua.da_khoi_dong)){
      toast('Đã khởi động việc chạy nền — theo dõi ở chỉ báo tiến trình trên đầu trang');
      askNotify(); startPolling();
    }
  }catch(e){
    bubble('model','Lỗi: '+e);
    inp.value = text;          // trả lại câu vừa gõ, khỏi gõ lại từ đầu
  }
  finally{
    clearInterval(tick); typing.remove(); btn.disabled = false; inp.focus();
    loadChatList();          // câu đầu tiên trở thành tiêu đề cuộc trò chuyện ở thanh bên
  }
}
$('#btnSend').onclick = send;
$('#msg').addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); send(); }});

/* theo dõi job ngay từ đầu, không đợi người dùng vào tab Dự án.
   Nhịp chậm này cũng là mạch đập kiểm tra server còn sống (banner mất kết nối). */
pollJobs(); setInterval(()=>{ if(!JOB_TIMER) pollJobs(); }, 5000);
setMode(PREF.get('agent', false));      // mở lại đúng chế độ + tab của lần trước
</script>
